<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私域枢纽 · PrivHub</title>
  <script src="/vue.global.prod.js"></script>
  <style>
    /* ============ 主题变量（两套护眼配色） ============ */
    :root {
      --bg: #eef1f5; --panel: #f7f9fb; --panel2: #ffffff; --line: #d8dee6;
      --text: #2e3440; --muted: #7a8699; --accent: #4a7bd6; --danger: #d05a5a; --warn: #c07a2b;
    }
    [data-theme="dark"] {
      --bg: #232834; --panel: #2a3040; --panel2: #333a4a; --line: #414a5c;
      --text: #d7dde8; --muted: #8a94a6; --accent: #5d8de0; --danger: #e07171; --warn: #e0a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
      transition: background .25s, color .25s;
    }

    /* ============ 登录/注册 ============ */
    .auth-wrap { height: 100vh; display: flex; align-items: center; justify-content: center; }
    .auth-card {
      background: var(--panel2); border: 1px solid var(--line); border-radius: 12px;
      padding: 36px 32px; width: 360px; box-shadow: 0 12px 40px rgba(0,0,0,.12);
    }
    .auth-card h1 { font-size: 20px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
    .logo-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); display: inline-block; }
    .auth-sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
    .field { margin-bottom: 13px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
    .field input {
      width: 100%; padding: 9px 12px; background: var(--bg); border: 1px solid var(--line);
      border-radius: 6px; color: var(--text); font-size: 14px; outline: none;
    }
    .field input:focus { border-color: var(--accent); }
    .btn { padding: 10px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; }
    .btn-primary { background: var(--accent); color: #fff; width: 100%; }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); }
    .auth-err { color: var(--danger); font-size: 12px; margin-top: 10px; min-height: 16px; }
    .auth-switch { margin-top: 14px; text-align: center; font-size: 12px; color: var(--muted); }
    .auth-switch a { color: var(--accent); cursor: pointer; }

    /* ============ 主界面 ============ */
    .app { display: flex; flex-direction: column; height: 100vh; }
    .topbar {
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
      background: var(--panel2); border-bottom: 1px solid var(--line);
    }
    .logo { font-weight: 700; font-size: 15px; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .tp-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .badge { font-size: 12px; padding: 3px 11px; border-radius: 20px; background: rgba(90,130,200,.15); color: var(--accent); }
    .badge.admin { background: rgba(192,122,43,.15); color: var(--warn); }
    .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; font-weight: 600; }
    .icon-btn { font-size: 12px; padding: 6px 12px; border-radius: 6px; background: transparent; border: 1px solid var(--line); color: var(--muted); cursor: pointer; }
    .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
    .icon-btn.on { color: var(--accent); border-color: var(--accent); background: rgba(90,130,200,.1); }

    .body { display: flex; flex: 1; overflow: hidden; }
    .sidebar {
      width: 220px; background: var(--panel); border-right: 1px solid var(--line);
      padding: 12px 10px; display: flex; flex-direction: column; overflow-y: auto;
    }
    .side-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .side-title { font-size: 12px; color: var(--muted); letter-spacing: .05em; }
    .tree-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; font-size: 13.5px; cursor: pointer; }
    .tree-item:hover { background: var(--panel2); }
    .tree-item.active { background: rgba(90,130,200,.15); color: var(--accent); }
    .tree-item .name { flex: 1; }
    .main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    .main-welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); gap: 14px; }
    .main-welcome .big { font-size: 22px; color: var(--text); }
    .main-head { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
    .main-head .title { font-size: 15px; font-weight: 600; }
    .main-head .crumb { color: var(--muted); font-size: 13px; }
    .breadcrumb { font-size: 14px; display: flex; align-items: center; gap: 2px; }
    .breadcrumb a { color: var(--accent); }
    .breadcrumb a:hover { text-decoration: underline; }
    .main-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .file-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .file-card {
      background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
      padding: 16px 12px; text-align: center; cursor: pointer; position: relative;
    }
    .file-card:hover { border-color: var(--accent); }
    .file-card.sel { border-color: var(--accent); background: rgba(90,130,200,.08); }
    .file-ico { font-size: 34px; margin-bottom: 8px; }
    .file-name { font-size: 12.5px; word-break: break-all; }
    .file-meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
    /* 列表视图（Windows 详细信息风格） */
    .file-table-wrap { display: flex; flex-direction: column; }
    .file-table-head, .file-table-row {
      display: grid; grid-template-columns: 1fr 90px 120px 110px; gap: 8px;
      padding: 8px 12px; align-items: center; font-size: 13px;
    }
    .file-table-head { color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); }
    .file-table-row { border-bottom: 1px solid var(--line); cursor: pointer; }
    .file-table-row:hover { background: var(--panel2); }
    .file-table-row.sel { background: rgba(90,130,200,.1); }
    .col-name { display: flex; align-items: center; gap: 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .tico { flex-shrink: 0; }
    .col-size, .col-type { color: var(--muted); }
    .col-time { color: var(--muted); }
    .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 40px 0; }
    .spacer { flex: 1; }

    /* 设置入口（左下角） */
    .settings-fab {
      position: fixed; left: 14px; bottom: 14px; z-index: 900;
      padding: 9px 14px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line);
      color: var(--muted); font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px;
    }
    .settings-fab:hover { color: var(--accent); border-color: var(--accent); }

    /* ============ 右侧预览容器 ============ */
    .right-panel { width: 340px; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; overflow: hidden; }
    .right-head { padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .right-close { cursor: pointer; color: var(--muted); }
    .right-close:hover { color: var(--danger); }
    .right-body { flex: 1; overflow: auto; padding: 14px 16px; }
    .preview-img { max-width: 100%; border-radius: 8px; }
    .preview-text { font-size: 12.5px; white-space: pre-wrap; word-break: break-all; color: var(--text); }
    .preview-pdf { width: 100%; height: 480px; border: 1px solid var(--line); border-radius: 8px; }
    .preview-empty { color: var(--muted); font-size: 12px; text-align: center; padding: 40px 0; }

    /* ============ 长按菜单 ============ */
    .ctx-menu { position: fixed; z-index: 1000; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 0; box-shadow: 0 10px 30px rgba(0,0,0,.2); min-width: 150px; }
    .ctx-item { padding: 9px 16px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
    .ctx-item:hover { background: var(--panel); }
    .ctx-item.danger { color: var(--danger); }

    /* ============ 弹窗 ============ */
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 1100; }
    .modal { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; width: 460px; max-width: 92vw; max-height: 86vh; padding: 22px; box-shadow: 0 16px 50px rgba(0,0,0,.3); display: flex; flex-direction: column; }
    .modal h2 { font-size: 16px; margin-bottom: 16px; }
    .modal-body { flex: 1; overflow-y: auto; }
    .modal-foot { margin-top: 16px; display: flex; gap: 10px; justify-content: flex-end; }
    .kv { display: flex; justify-content: space-between; font-size: 13px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
    .kv .k { color: var(--muted); }

    /* 用户管理表格 */
    .u-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .u-table th, .u-table td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
    .u-table th { color: var(--muted); font-weight: 500; font-size: 12px; }
    .u-project-chip { display: inline-block; font-size: 11px; padding: 1px 7px; margin: 1px 2px; border-radius: 10px; background: rgba(90,130,200,.12); color: var(--accent); }
    .u-row { cursor: pointer; }
    .u-row:hover { background: var(--panel); }
    .small-btn { font-size: 11px; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
    .small-btn:hover { color: var(--accent); border-color: var(--accent); }
    .small-btn.danger:hover { color: var(--danger); border-color: var(--danger); }

    /* 主题选择 */
    .theme-opts { display: flex; gap: 12px; }
    .theme-opt { flex: 1; border: 2px solid var(--line); border-radius: 10px; padding: 16px; text-align: center; cursor: pointer; }
    .theme-opt.active { border-color: var(--accent); }
    .theme-swatch { height: 40px; border-radius: 6px; margin-bottom: 8px; }
    .swatch-light { background: #eef1f5; border: 1px solid #d8dee6; }
    .swatch-dark { background: #232834; border: 1px solid #414a5c; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const { createApp, reactive, ref, computed, onMounted } = Vue

    /* ============ 全局状态 ============ */
    const AUTH = reactive({
      token: localStorage.getItem('privhub_token') || '',
      user: null,
    })
    const THEME = reactive({ theme: localStorage.getItem('privhub_theme') || 'light' })
    const bus = reactive({ recentRefresh: 0 })

    function applyTheme() {
      document.documentElement.setAttribute('data-theme', THEME.theme)
      localStorage.setItem('privhub_theme', THEME.theme)
    }

    async function api(path, opts = {}) {
      const headers = { 'content-type': 'application/json', ...(opts.headers || {}) }
      if (AUTH.token) headers['authorization'] = 'Bearer ' + AUTH.token
      const res = await fetch(path, { ...opts, headers })
      return res.json()
    }
    function logout() {
      AUTH.token = ''; AUTH.user = null
      localStorage.removeItem('privhub_token')
    }

    /* ============ 登录/注册视图 ============ */
    const AuthView = {
      data() {
        return { mode: 'login', username: '', password: '', displayName: '', err: '' }
      },
      methods: {
        async submit() {
          this.err = ''
          if (this.mode === 'login') {
            const r = await api('/privhub/api/login', { method: 'POST', body: JSON.stringify({ username: this.username, password: this.password }) })
            if (!r.ok) { this.err = r.error || '登录失败'; return }
            AUTH.token = r.token; AUTH.user = r.user
            localStorage.setItem('privhub_token', r.token)
          } else {
            if (this.password.length < 6) { this.err = '密码至少6位'; return }
            const r = await api('/privhub/api/register', { method: 'POST', body: JSON.stringify({ username: this.username, password: this.password, displayName: this.displayName }) })
            if (!r.ok) { this.err = r.error || '注册失败'; return }
            this.mode = 'login'; this.err = '注册成功，请登录'
          }
        },
      },
      template: `
        <div class="auth-wrap">
          <div class="auth-card">
            <h1><span class="logo-dot"></span>私域枢纽</h1>
            <div class="auth-sub">公司内部文件管理系统</div>
            <div class="field"><label>用户名</label><input v-model="username" placeholder="请输入用户名" /></div>
            <div class="field" v-if="mode === 'register'"><label>显示名（可选）</label><input v-model="displayName" placeholder="显示名" /></div>
            <div class="field"><label>密码</label><input v-model="password" type="password" @keyup.enter="submit" placeholder="请输入密码" /></div>
            <button class="btn btn-primary" @click="submit">{{ mode === 'login' ? '登 录' : '注 册' }}</button>
            <div class="auth-err">{{ err }}</div>
            <div class="auth-switch">
              <template v-if="mode === 'login'">
                没有账号？<a @click="mode='register'; err=''">申请注册</a>
              </template>
              <template v-else>
                已有账号？<a @click="mode='login'; err=''">返回登录</a>
              </template>
            </div>
          </div>
        </div>
      `
    }

    /* ============ 长按菜单（文件操作） ============ */
    let pressTimer = null

    /* ============ 根组件 ============ */
    const App = {
      data() {
        return {
          auth: AUTH,
          theme: THEME,
          projects: [],
          currentProject: null,
          currentPath: '',      // 当前项目内的相对子路径（'' 表示项目根）
          entries: [],
          listLoading: false,
          selected: null,
          preview: null,       // { type, data, name }
          rightOpen: false,
          ctxMenu: null,       // { x, y, entry }
          settingsOpen: false,
          detailTarget: null,
          adminOpen: false,
          adminUsers: [],
          adminAllProjects: [],
          editUser: null,      // 正在编辑的用户
          mkdirTarget: null,
          resetPwdUser: null,  // 正在重置密码的用户
          resetPwdValue: '',   // 新密码输入
          sortKey: 'name',     // 排序字段：name/size/mtime
          sortAsc: true,       // 是否升序
          viewMode: 'grid',    // 视图：grid 网格 / list 列表
          checked: {},         // 多选：name -> true
          treeLoaded: {},      // key: project/path -> { expanded: bool, children: 子目录列表 }
        }
      },
      computed: {
        loggedIn() { return this.auth.user !== null },
        isAdmin() { return this.auth.user && this.auth.user.role === 'admin' },
        crumbs() {
          // 面包屑：项目 + 逐级子路径
          const parts = this.currentPath ? this.currentPath.split('/').filter(Boolean) : []
          const arr = [{ label: this.currentProject, path: '' }]
          let acc = ''
          for (const p of parts) { acc = acc ? acc + '/' + p : p; arr.push({ label: p, path: acc }) }
          return arr
        },
        sortedEntries() {
          const arr = [...this.entries]
          const key = this.sortKey
          const asc = this.sortAsc ? 1 : -1
          arr.sort((a, b) => {
            // 文件夹始终排在文件前面（像 Windows）
            if (a.isDir !== b.isDir) return a.isDir ? -1 : 1
            let va, vb
            if (key === 'name') { va = a.name; vb = b.name }
            else if (key === 'size') { va = a.isDir ? -1 : a.size; vb = b.isDir ? -1 : b.size }
            else if (key === 'mtime') { va = a.mtime; vb = b.mtime }
            else { va = a.name; vb = b.name }
            if (va < vb) return -1 * asc
            if (va > vb) return 1 * asc
            return 0
          })
          return arr
        },
      },
      provide() {
        return {
          treeApi: {
            isExpanded: (project, path) => this.isExpanded(project, path),
            childrenOf: (project, path) => this.childrenOf(project, path),
            toggleTree: (project, path) => this.toggleTree(project, path),
            openDir: (project, path) => this.openDir(project, path),
            delProject: (name) => this.delProject(name),
            isAdmin: () => this.isAdmin,
          },
        }
      },
      methods: {
        async loadProjects() {
          const r = await api('/privhub/api/projects')
          if (r.ok) this.projects = r.projects
        },
        // 进入某项目某子路径，中间显示其内容
        async openDir(project, path) {
          this.currentProject = project
          this.currentPath = path || ''
          this.selected = null; this.preview = null; this.rightOpen = false
          this.listLoading = true
          const q = path ? '&path=' + encodeURIComponent(path) : ''
          const r = await api('/privhub/api/list?project=' + encodeURIComponent(project) + q)
          this.listLoading = false
          if (r.ok) this.entries = r.entries
          else this.entries = []
        },
        async openProject(name) {
          await this.openDir(name, '')
        },
        async backToWelcome() {
          this.currentProject = null; this.currentPath = ''
          this.entries = []; this.selected = null; this.preview = null; this.rightOpen = false
        },
        goHome() { this.backToWelcome() },

        // 面包屑跳转到某级子路径
        async gotoCrumb(path) {
          await this.openDir(this.currentProject, path)
        },

        // 树节点展开/折叠（懒加载子目录）
        treeKey(project, path) {
          return project + '/' + (path || '')
        },
        async toggleTree(project, path) {
          const key = this.treeKey(project, path)
          if (!this.treeLoaded[key]) {
            // 首次：加载该目录下的子文件夹列表，并标记展开
            this.treeLoaded[key] = { expanded: true, children: [] }
            const q = path ? '&path=' + encodeURIComponent(path) : ''
            const r = await api('/privhub/api/list?project=' + encodeURIComponent(project) + q)
            if (r.ok) {
              this.treeLoaded[key].children = r.entries.filter(e => e.isDir).map(e => ({ name: e.name, path: path ? path + '/' + e.name : e.name }))
            }
          } else {
            this.treeLoaded[key].expanded = !this.treeLoaded[key].expanded
          }
        },
        isExpanded(project, path) {
          const key = this.treeKey(project, path)
          return this.treeLoaded[key] && this.treeLoaded[key].expanded
        },
        childrenOf(project, path) {
          const key = this.treeKey(project, path)
          return (this.treeLoaded[key] && this.treeLoaded[key].children) || []
        },

        // 计算某条目在当前子路径下的完整相对路径
        relPathOf(name) {
          return this.currentPath ? this.currentPath + '/' + name : name
        },
        // 排序切换：点同一字段切换升降序，点新字段默认升序
        toggleSort(key) {
          if (this.sortKey === key) this.sortAsc = !this.sortAsc
          else { this.sortKey = key; this.sortAsc = true }
        },
        setViewMode(m) { this.viewMode = m },
        async selectEntry(e) {
          this.selected = e
          if (e.isDir) {
            // 单击文件夹：仅选中，不弹预览（双击才进入）
            this.preview = null
            this.rightOpen = false
            return
          }
          // 选文件 → 右侧弹出预览
          const rel = this.relPathOf(e.name)
          const r = await api('/privhub/api/preview?project=' + encodeURIComponent(this.currentProject) + '&path=' + encodeURIComponent(rel))
          if (r.ok) { this.preview = { type: r.type, data: r.data, name: e.name }; this.rightOpen = true }
          else { this.preview = { type: 'unknown', data: '', name: e.name }; this.rightOpen = true }
        },

        // 双击：文件夹 → 进入（像 Windows 双击打开）；文件 → 预览
        openEntry(e) {
          if (e.isDir) {
            // 双击文件夹，进入子目录
            const rel = this.relPathOf(e.name)
            this.openDir(this.currentProject, rel)
          } else {
            // 双击文件：触发预览（与单击选中一致）
            this.selectEntry(e)
          }
        },

        /* 长按 2 秒弹菜单 */
        startPress(e, el) {
          pressTimer = setTimeout(() => {
            const rect = el.getBoundingClientRect()
            this.ctxMenu = {
              x: Math.min(rect.left + 20, window.innerWidth - 170),
              y: Math.min(rect.top + 20, window.innerHeight - 150),
              entry: e,
            }
          }, 2000)
        },
        cancelPress() { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null } },
        closeMenu() { this.ctxMenu = null },

        openDetail() { this.detailTarget = this.ctxMenu ? this.ctxMenu.entry : this.selected; this.ctxMenu = null },
        openMkdir() { this.mkdirTarget = this.currentProject; this.ctxMenu = null },
        async doRename() {
          const e = this.ctxMenu ? this.ctxMenu.entry : null
          this.ctxMenu = null
          if (!e) return
          const rel = this.relPathOf(e.name)
          const newName = prompt('重命名为：', e.name)
          if (!newName || newName === e.name) return
          const r = await api('/privhub/api/rename', { method: 'POST', body: JSON.stringify({ project: this.currentProject, path: rel, newName }) })
          if (r.ok) await this.openDir(this.currentProject, this.currentPath)
          else alert(r.error || '重命名失败')
        },
        async doDelete() {
          const e = this.ctxMenu ? this.ctxMenu.entry : null
          this.ctxMenu = null
          if (!e) return
          if (!confirm('确认删除 ' + e.name + ' ？')) return
          const rel = this.relPathOf(e.name)
          const r = await api('/privhub/api/delete', { method: 'POST', body: JSON.stringify({ project: this.currentProject, path: rel }) })
          if (r.ok) await this.openDir(this.currentProject, this.currentPath)
          else alert(r.error || '删除失败')
        },

        /* 设置 */
        setTheme(t) { this.theme.theme = t; applyTheme() },

        /* 管理员：新建项目 */
        async newProject() {
          const name = prompt('新项目名称：')
          if (!name) return
          const r = await api('/privhub/api/project-create', { method: 'POST', body: JSON.stringify({ name }) })
          if (r.ok) { await this.loadProjects() }
          else alert(r.error || '新建失败')
        },
        async delProject(name) {
          if (!confirm('确认删除项目 ' + name + ' 及其所有文件？')) return
          const r = await api('/privhub/api/project-delete', { method: 'POST', body: JSON.stringify({ name }) })
          if (r.ok) { await this.loadProjects(); if (this.currentProject === name) this.backToWelcome() }
          else alert(r.error || '删除失败')
        },

        /* 管理员：用户管理 */
        async openAdmin() {
          const r = await api('/privhub/api/admin/users')
          if (r.ok) { this.adminUsers = r.users; this.adminAllProjects = r.allProjects }
          this.adminOpen = true
        },
        openEditUser(u) { this.editUser = JSON.parse(JSON.stringify(u)) },
        toggleProject(p) {
          const i = this.editUser.projects.indexOf(p)
          if (i >= 0) this.editUser.projects.splice(i, 1)
          else this.editUser.projects.push(p)
        },
        async saveUser() {
          const r = await api('/privhub/api/admin/user-update', { method: 'POST', body: JSON.stringify(this.editUser) })
          if (r.ok) { this.editUser = null; await this.openAdmin() }
          else alert(r.error || '保存失败')
        },
        async deleteUser(u) {
          if (!confirm('确认删除用户 ' + u.username + ' ？')) return
          const r = await api('/privhub/api/admin/user-delete', { method: 'POST', body: JSON.stringify({ username: u.username }) })
          if (r.ok) await this.openAdmin()
          else alert(r.error || '删除失败')
        },
        /* 重置密码 */
        openResetPwd(u) {
          this.resetPwdUser = u
          this.resetPwdValue = ''
        },
        async submitResetPwd() {
          const u = this.resetPwdUser
          if (!u) return
          if (this.resetPwdValue.length < 6) { alert('新密码至少6位'); return }
          const r = await api('/privhub/api/admin/user-reset-password', { method: 'POST', body: JSON.stringify({ username: u.username, newPassword: this.resetPwdValue }) })
          if (r.ok) { this.resetPwdUser = null; this.resetPwdValue = ''; alert('密码已重置'); await this.openAdmin() }
          else alert(r.error || '重置失败')
        },

        /* 新建文件夹（在当前子路径下） */
        async submitMkdir() {
          const name = prompt('文件夹名称：')
          if (!name) return
          const r = await api('/privhub/api/mkdir', { method: 'POST', body: JSON.stringify({ project: this.currentProject, path: this.currentPath, name }) })
          if (r.ok) { await this.openDir(this.currentProject, this.currentPath); this.refreshTree() }
          else alert(r.error || '新建失败')
        },
        // 新建后刷新当前树的子目录缓存
        refreshTree() {
          const key = this.treeKey(this.currentProject, this.currentPath)
          if (this.treeLoaded[key]) this.treeLoaded[key].children = []
          const parentPath = this.currentPath.includes('/') ? this.currentPath.slice(0, this.currentPath.lastIndexOf('/')) : ''
          const pkey = this.treeKey(this.currentProject, parentPath)
          if (this.treeLoaded[pkey]) this.treeLoaded[pkey].children = []
        },

        async doLogout() {
          try { await api('/privhub/api/logout') } catch {}
          logout()
        },
      },
      async mounted() {
        applyTheme()
        const self = this
        // 若已有 token，尝试恢复会话
        if (AUTH.token) {
          const r = await api('/privhub/api/me')
          if (r.ok) { AUTH.user = r.user; await self.loadProjects() } else { logout() }
        }
        // 监听登录态：登录成功后自动加载项目列表
        this._unwatch = this.$watch('loggedIn', (v) => {
          if (v) self.loadProjects()
        })
      },
      beforeUnmount() {
        if (this._unwatch) this._unwatch()
      },
      template: `
        <!-- 未登录 -->
        <auth-view v-if="!loggedIn"></auth-view>

        <!-- 已登录 -->
        <div v-else class="app">
          <!-- 顶栏 -->
          <div class="topbar">
            <div class="logo" @click="goHome" style="cursor:pointer"><span class="logo-dot"></span>私域枢纽</div>
            <div class="tp-right">
              <span class="badge" :class="{ admin: isAdmin }">{{ isAdmin ? '👑 管理员' : '👤 普通用户' }}</span>
              <div class="avatar">{{ (auth.user.displayName || auth.user.username)[0] }}</div>
              <button class="icon-btn" @click="doLogout">退出</button>
              <button class="icon-btn" :class="{ on: rightOpen }" @click="rightOpen = !rightOpen">{{ rightOpen ? '收起侧栏' : '打开侧栏' }}</button>
            </div>
          </div>

          <div class="body">
            <!-- 左侧：可展开的文件树 -->
            <div class="sidebar">
              <div class="side-head">
                <span class="side-title">文件目录</span>
                <button v-if="isAdmin" class="small-btn" @click="newProject" title="新建项目">＋项目</button>
              </div>
              <div class="tree-item" :class="{ active: currentProject === null }" @click="backToWelcome">
                <span>🏠</span><span class="name">欢迎</span>
              </div>
              <div v-for="p in projects" :key="p">
                <tree-node
                  :label="p"
                  :project="p"
                  :path="''"
                  :depth="0"
                  :active="currentProject === p && currentPath === ''"
                ></tree-node>
              </div>
            </div>

            <!-- 中间 -->
            <div class="main">
              <!-- 欢迎语 -->
              <div v-if="currentProject === null" class="main-welcome">
                <div class="big">欢迎使用私域枢纽 · 公司文件管理系统</div>
                <div>请在左侧选择项目文件夹开始浏览文件</div>
              </div>
              <!-- 文件列表 -->
              <template v-else>
                <div class="main-head">
                  <!-- 面包屑导航 -->
                  <span class="breadcrumb">
                    <span v-for="(c, i) in crumbs" :key="i">
                      <a v-if="i < crumbs.length - 1" @click="gotoCrumb(c.path)" style="cursor:pointer">{{ i === 0 ? '📁 ' : '' }}{{ c.label }}</a>
                      <span v-else style="color:var(--text)">{{ i === 0 ? '📁 ' : '' }}{{ c.label }}</span>
                      <span v-if="i < crumbs.length - 1" class="crumb"> / </span>
                    </span>
                  </span>
                  <span class="crumb" style="margin-left:8px">共 {{ entries.length }} 项</span>
                  <span class="spacer"></span>
                  <button class="icon-btn" @click="toggleSort('name')">名称{{ sortKey==='name' ? (sortAsc?' ↑':' ↓') : '' }}</button>
                  <button class="icon-btn" @click="toggleSort('size')">大小{{ sortKey==='size' ? (sortAsc?' ↑':' ↓') : '' }}</button>
                  <button class="icon-btn" @click="toggleSort('mtime')">时间{{ sortKey==='mtime' ? (sortAsc?' ↑':' ↓') : '' }}</button>
                  <button class="icon-btn" @click="setViewMode('grid')" :class="{on: viewMode==='grid'}">▦</button>
                  <button class="icon-btn" @click="setViewMode('list')" :class="{on: viewMode==='list'}">☰</button>
                  <button class="icon-btn" @click="submitMkdir">＋新建文件夹</button>
                </div>
                <div class="main-body">
                  <div v-if="listLoading" class="empty">加载中…</div>
                  <div v-else-if="entries.length === 0" class="empty">（空目录）</div>
                  <!-- 网格视图 -->
                  <div v-else-if="viewMode === 'grid'" class="file-list">
                    <div
                      v-for="e in sortedEntries" :key="e.name"
                      class="file-card" :class="{ sel: selected && selected.name === e.name }"
                      @click="selectEntry(e)"
                      @dblclick="openEntry(e)"
                      @mousedown="startPress(e, $event.currentTarget)"
                      @mouseup="cancelPress"
                      @mouseleave="cancelPress"
                      @contextmenu.prevent
                    >
                      <div class="file-ico">{{ e.isDir ? '📁' : fileIcon(e.type) }}</div>
                      <div class="file-name">{{ e.name }}</div>
                      <div class="file-meta">{{ e.isDir ? e.type : (e.sizeText + ' · ' + e.type) }}</div>
                    </div>
                  </div>
                  <!-- 列表视图（像 Windows 详细信息） -->
                  <div v-else class="file-table-wrap">
                    <div class="file-table-head">
                      <span class="col-name">名称</span>
                      <span class="col-size">大小</span>
                      <span class="col-type">类型</span>
                      <span class="col-time">修改时间</span>
                    </div>
                    <div
                      v-for="e in sortedEntries" :key="e.name"
                      class="file-table-row" :class="{ sel: selected && selected.name === e.name }"
                      @click="selectEntry(e)"
                      @dblclick="openEntry(e)"
                      @mousedown="startPress(e, $event.currentTarget)"
                      @mouseup="cancelPress"
                      @mouseleave="cancelPress"
                      @contextmenu.prevent
                    >
                      <span class="col-name"><span class="tico">{{ e.isDir ? '📁' : fileIcon(e.type) }}</span>{{ e.name }}</span>
                      <span class="col-size">{{ e.sizeText }}</span>
                      <span class="col-type">{{ e.type }}</span>
                      <span class="col-time">{{ e.mtime || '—' }}</span>
                    </div>
                  </div>
                </div>
              </template>
            </div>

            <!-- 右侧预览容器 -->
            <div v-if="rightOpen" class="right-panel">
              <div class="right-head">
                <span>预览</span>
                <span class="right-close" @click="rightOpen = false">✕</span>
              </div>
              <div class="right-body">
                <div v-if="!selected" class="preview-empty">选中文件后在此预览</div>
                <div v-else-if="selected.isDir" class="preview-empty">📁 文件夹<br/>{{ selected.name }}</div>
                <div v-else-if="preview && preview.type === 'image'" style="text-align:center">
                  <div style="font-weight:600;margin-bottom:10px">{{ selected.name }}</div>
                  <img class="preview-img" :src="previewImageUrl(selected.name)" alt="preview" />
                </div>
                <div v-else-if="preview && preview.type === 'text'" style="text-align:left">
                  <div style="font-weight:600;margin-bottom:10px">{{ selected.name }}</div>
                  <pre class="preview-text">{{ preview.data }}</pre>
                </div>
                <div v-else-if="preview && preview.type === 'pdf'" style="text-align:center">
                  <div style="font-weight:600;margin-bottom:10px">{{ selected.name }}</div>
                  <iframe class="preview-pdf" :src="previewPdfUrl(selected.name)"></iframe>
                </div>
                <div v-else class="preview-empty">
                  <div style="font-size:30px;margin-bottom:10px">📄</div>
                  {{ selected ? selected.name : '' }}<br/>暂不支持预览该文件类型
                </div>
              </div>
            </div>
          </div>

          <!-- 左下角设置 -->
          <div class="settings-fab" @click="settingsOpen = true">⚙ 设置</div>

          <!-- 长按菜单 -->
          <div v-if="ctxMenu" class="ctx-menu" :style="{ left: ctxMenu.x + 'px', top: ctxMenu.y + 'px' }" @click.stop>
            <div class="ctx-item" @click="openDetail">ℹ️ 详情</div>
            <div class="ctx-item" @click="doRename">✏️ 重命名</div>
            <div v-if="ctxMenu.entry.isDir" class="ctx-item" @click="openMkdir">＋ 新建子文件夹</div>
            <div class="ctx-item danger" @click="doDelete">🗑 删除</div>
          </div>

          <!-- 设置弹窗 -->
          <div v-if="settingsOpen" class="modal-mask" @click.self="settingsOpen = false">
            <div class="modal">
              <h2>⚙ 设置</h2>
              <div class="modal-body">
                <div style="font-size:13px;color:var(--muted);margin-bottom:12px">主题风格</div>
                <div class="theme-opts">
                  <div class="theme-opt" :class="{ active: theme.theme === 'light' }" @click="setTheme('light')">
                    <div class="theme-swatch swatch-light"></div>
                    <div>浅色（护眼）</div>
                  </div>
                  <div class="theme-opt" :class="{ active: theme.theme === 'dark' }" @click="setTheme('dark')">
                    <div class="theme-swatch swatch-dark"></div>
                    <div>深色（护眼）</div>
                  </div>
                </div>
                <div v-if="isAdmin" style="margin-top:20px">
                  <div style="font-size:13px;color:var(--muted);margin-bottom:12px">管理员功能</div>
                  <button class="btn btn-primary" style="width:auto" @click="settingsOpen=false; openAdmin()">👥 用户管理</button>
                </div>
              </div>
              <div class="modal-foot">
                <button class="btn btn-ghost" @click="settingsOpen = false">关 闭</button>
              </div>
            </div>
          </div>

          <!-- 详情弹窗 -->
          <div v-if="detailTarget" class="modal-mask" @click.self="detailTarget = null">
            <div class="modal" style="width:380px">
              <h2>{{ detailTarget.isDir ? '📁' : '📄' }} {{ detailTarget.name }}</h2>
              <div class="modal-body">
                <div class="kv"><span class="k">名称</span><span>{{ detailTarget.name }}</span></div>
                <div class="kv"><span class="k">类型</span><span>{{ detailTarget.type }}</span></div>
                <div class="kv"><span class="k">大小</span><span>{{ detailTarget.sizeText }}</span></div>
                <div class="kv"><span class="k">修改时间</span><span>{{ detailTarget.mtime || '—' }}</span></div>
                <div class="kv"><span class="k">所属项目</span><span>{{ currentProject }}</span></div>
              </div>
              <div class="modal-foot">
                <button class="btn btn-ghost" @click="detailTarget = null">关 闭</button>
              </div>
            </div>
          </div>

          <!-- 用户管理弹窗 -->
          <div v-if="adminOpen" class="modal-mask" @click.self="adminOpen = false">
            <div class="modal" style="width:600px">
              <h2>👥 用户管理</h2>
              <div class="modal-body">
                <table class="u-table">
                  <thead><tr><th>用户名</th><th>显示名</th><th>角色</th><th>负责项目</th><th>操作</th></tr></thead>
                  <tbody>
                    <tr class="u-row" v-for="u in adminUsers" :key="u.username">
                      <td>{{ u.username }}</td>
                      <td>{{ u.displayName }}</td>
                      <td>{{ u.role === 'admin' ? '管理员' : '普通用户' }}</td>
                      <td><span class="u-project-chip" v-for="p in u.projects" :key="p">{{ p }}</span></td>
                      <td>
                        <button class="small-btn" @click="openEditUser(u)">编辑</button>
                        <button class="small-btn" @click="openResetPwd(u)">重置密码</button>
                        <button class="small-btn danger" @click="deleteUser(u)" v-if="u.username !== 'admin'">删除</button>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div class="modal-foot">
                <button class="btn btn-ghost" @click="adminOpen = false">关 闭</button>
              </div>
            </div>
          </div>

          <!-- 编辑用户弹窗 -->
          <div v-if="editUser" class="modal-mask" @click.self="editUser = null">
            <div class="modal" style="width:420px">
              <h2>编辑用户：{{ editUser.username }}</h2>
              <div class="modal-body">
                <div class="field"><label>显示名</label><input v-model="editUser.displayName" /></div>
                <div class="field">
                  <label>角色</label>
                  <select v-model="editUser.role" style="width:100%;padding:9px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text)">
                    <option value="user">普通用户</option>
                    <option value="admin">管理员</option>
                  </select>
                </div>
                <div class="field">
                  <label>负责的项目（勾选其可访问的项目）</label>
                  <div style="display:flex;flex-wrap:wrap;gap:8px">
                    <span v-for="p in adminAllProjects" :key="p" class="u-project-chip" style="cursor:pointer;padding:4px 10px" :style="editUser.projects.includes(p) ? 'background:rgba(90,130,200,.25)' : ''" @click="toggleProject(p)">{{ p }}</span>
                  </div>
                </div>
              </div>
              <div class="modal-foot">
                <button class="btn btn-ghost" @click="editUser = null">取 消</button>
                <button class="btn btn-primary" style="width:auto" @click="saveUser">保 存</button>
              </div>
            </div>
          </div>

          <!-- 重置密码弹窗 -->
          <div v-if="resetPwdUser" class="modal-mask" @click.self="resetPwdUser = null">
            <div class="modal" style="width:380px">
              <h2>🔑 重置密码：{{ resetPwdUser.username }}</h2>
              <div class="modal-body">
                <div class="field">
                  <label>新密码（至少6位）</label>
                  <input v-model="resetPwdValue" type="text" placeholder="输入新密码" />
                </div>
                <div style="font-size:12px;color:var(--muted)">
                  重置后该用户的旧密码立即失效，原有登录会话将被强制退出。
                </div>
              </div>
              <div class="modal-foot">
                <button class="btn btn-ghost" @click="resetPwdUser = null">取 消</button>
                <button class="btn btn-primary" style="width:auto" @click="submitResetPwd">确认重置</button>
              </div>
            </div>
          </div>
        </div>
      `
    }

    // 文件图标辅助（挂到 App methods 上不方便，用全局函数）
    function fileIcon(type) {
      const t = (type || '').toLowerCase()
      const map = {
        'png': '🖼', 'jpg': '🖼', 'jpeg': '🖼', 'gif': '🖼', 'webp': '🖼', 'svg': '🖼', 'bmp': '🖼',
        'pdf': '📕', 'doc': '📘', 'docx': '📘', 'xls': '📗', 'xlsx': '📗', 'ppt': '📙', 'pptx': '📙',
        'txt': '📄', 'md': '📄', 'zip': '🗜', 'rar': '🗜', 'mp3': '🎵', 'mp4': '🎬', 'json': '📄',
      }
      return map[t] || '📄'
    }

    /* ============ 递归树节点组件（可展开子文件夹，任意深度） ============ */
    const TreeNode = {
      name: 'tree-node',
      props: {
        label: String, project: String, path: String, depth: Number, active: Boolean,
      },
      inject: ['treeApi'],
      computed: {
        expanded() { return this.treeApi.isExpanded(this.project, this.path) },
        children() { return this.treeApi.childrenOf(this.project, this.path) },
        isAdmin() { return this.treeApi.isAdmin() },
        isActivePath() {
          // 用 App 的 currentProject/currentPath 判断（通过 treeApi 提供）
          return false
        },
      },
      methods: {
        onToggle() { this.treeApi.toggleTree(this.project, this.path) },
        onOpen() { this.treeApi.openDir(this.project, this.path) },
        onDel() { this.treeApi.delProject(this.project) },
      },
      template: `
        <div>
          <div class="tree-item" :class="{ active: active }" :style="{ paddingLeft: (10 + depth * 16) + 'px' }">
            <span class="tree-arrow" @click.stop="onToggle" style="cursor:pointer;width:14px;display:inline-block">
              {{ expanded ? '▾' : '▸' }}
            </span>
            <span @click="onOpen" style="flex:1;display:flex;align-items:center;gap:6px;cursor:pointer">
              <span>{{ expanded ? '📂' : '📁' }}</span><span class="name">{{ label }}</span>
            </span>
            <button v-if="isAdmin && path === '' && depth === 0" class="small-btn danger" @click.stop="onDel" title="删除项目">🗑</button>
          </div>
          <tree-node
            v-for="c in (expanded ? children : [])"
            :key="c.path"
            :label="c.name"
            :project="project"
            :path="c.path"
            :depth="depth + 1"
            :active="false"
          ></tree-node>
        </div>
      `
    }

    const app = createApp(App)
    app.component('auth-view', AuthView)
    app.component('tree-node', TreeNode)
    app.mixin({
      methods: {
        fileIcon,
        previewImageUrl(name) {
          const rel = this.currentPath ? this.currentPath + '/' + name : name
          return '/privhub/api/preview-raw?project=' + encodeURIComponent(this.currentProject) + '&path=' + encodeURIComponent(rel)
        },
        previewPdfUrl(name) {
          const rel = this.currentPath ? this.currentPath + '/' + name : name
          return '/privhub/api/preview-raw?project=' + encodeURIComponent(this.currentProject) + '&path=' + encodeURIComponent(rel)
        },
      }
    })
    app.mount('#app')
  </script>
</body>
</html>
