/* ================= 连线 =================

/* ================= 渲染 ================= */
const tip = document.getElementById('tip');
const stage = document.getElementById('stage');
const LINE_INFO = {
  0: { c:'#8b949e', dash:null,  desc:'装配链' },
  1: { c:'#f778ba', dash:'7 4', desc:'audit:logged' },
  2: { c:'#56d364', dash:'7 4', desc:'file:saved' },
  7: { c:'#39c5cf', dash:'7 4', desc:'file:changed' },
  3: { c:'#79c0ff', dash:'7 4', desc:'meta:changed' },
  4: { c:'#d2a8ff', dash:null,  desc:'ACL 守卫' },
  5: { c:'#ffa657', dash:'5 4', desc:'机制复用' },
  6: { c:'#8b949e', dash:null,  desc:'服务依赖' },
};
const GROUP_FILL = {
  0: '#161b22', 1: '#0f2a1a', 2: '#10233d', 3: '#161b22', 4: '#241b3d', 5: '#3d2410',
};
const GROUP_STROKE = {
  0: '#30363d', 1: '#3fb950', 2: '#388bfd', 3: '#30363d', 4: '#a371f7', 5: '#f0883e',
};

const byId = Object.fromEntries(NODES.map((n) => [n.id, n]));
function edge(a, b) {
  const na = byId[a], nb = byId[b];
  const x1 = na.x + na.w / 2, y1 = na.y + na.h / 2;
  const x2 = nb.x + nb.w / 2, y2 = nb.y + nb.h / 2;
  let mx1 = x1, my1 = y1, mx2 = x2, my2 = y2;
  // 端点贴边：水平连线（装配/事件较多）用简单中点
  const d = Math.abs(x2 - x1);
  if (d > 120) { mx1 = x1 + (x2 > x1 ? 1 : -1) * Math.min(na.w / 2, d / 3); mx2 = x2 + (x1 > x2 ? 1 : -1) * Math.min(nb.w / 2, d / 3); }
  else { my1 = y1 + (y2 > y1 ? 1 : -1) * Math.min(na.h / 2, 40); my2 = y2 + (y1 > y2 ? 1 : -1) * Math.min(nb.h / 2, 40); }
  return { x1, y1, x2, y2, mx1, my1, mx2, my2 };
}
function showTip(html, ev) {
  tip.innerHTML = html; tip.style.display = 'block';
  const pad = 14, tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + tw > innerWidth - 8) x = ev.clientX - tw - 14;
  if (y + th > innerHeight - 8) y = ev.clientY - th - 14;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip() { tip.style.display = 'none'; }
function nodeTip(n) {
  const g = { 1: 'L2 能力 Service', 2: 'L1 枢纽/守卫', 3: 'L3 功能插件（后端）', 4: '纯前端插件（manifest）', 5: 'Agent 网关' }[n.g] || '';
  return '<b>' + n.lbl + '</b> <span class="k">(' + g + ')</span>\n' + (n.sub ? '<span class="k">' + n.sub + '</span>\n' : '') + '\n' + (n.tip || '');
}
let k = 0;
for (const n of NODES) {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('class', 'node'); g.setAttribute('transform', `translate(${n.x},${n.y})`);
  g.innerHTML = `<rect width="${n.w}" height="${n.h}" fill="${GROUP_FILL[n.g]}" stroke="${GROUP_STROKE[n.g]}"></rect>
    <text class="ico" x="14" y="${n.h / 2 + 7}">${n.ico}</text>
    <text class="lbl" x="42" y="${n.h / 2 - 4}" fill="#e6edf3">${n.lbl}</text>
    <text class="sub" x="42" y="${n.h / 2 + 13}">${n.sub || ''}</text>`;
  g.addEventListener('mouseenter', (ev) => showTip(nodeTip(n), ev));
  g.addEventListener('mousemove', (ev) => showTip(nodeTip(n), ev));
  g.addEventListener('mouseleave', hideTip);
  stage.appendChild(g);
  k++;
}
for (const l of LINKS) {
  const { x1, y1, x2, y2, mx1, my1, mx2, my2 } = edge(l.a, l.b);
  const info = LINE_INFO[l.t];
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  const dash = info.dash ? `stroke-dasharray="${info.dash}"` : '';
  path.setAttribute('d', `M ${x1} ${y1} C ${mx1} ${my1}, ${mx2} ${my2}, ${x2} ${y2}`);
  path.setAttribute('class', 'link');
  path.setAttribute('stroke', info.c);
  path.setAttribute('stroke-dasharray', info.dash || '');
  path.addEventListener('mouseenter', (ev) => showTip('<b>' + (l.tip || info.desc) + '</b>', ev));
  path.addEventListener('mousemove', (ev) => showTip('<b>' + (l.tip || info.desc) + '</b>', ev));
  path.addEventListener('mouseleave', hideTip);
  stage.appendChild(path);
  // 箭头
  const ang = Math.atan2(y2 - y1, x2 - x1);
  const hl = Math.min(10, Math.hypot(x2 - x1, y2 - y1) / 4);
  const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  arrow.setAttribute('d', `M ${x2} ${y2} L ${x2 - hl * Math.cos(ang - 0.45)} ${y2 - hl * Math.sin(ang - 0.45)} L ${x2 - hl * Math.cos(ang + 0.45)} ${y2 - hl * Math.sin(ang + 0.45)} Z`);
  arrow.setAttribute('fill', info.c);
  stage.appendChild(arrow);
}

/* ================= 平移缩放 ================= */
const wrap = document.getElementById('wrap');
let scale = 1, tx = 0, ty = 0, pan = null;
function apply() { stage.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`); }
function fit() {
  const W = 1900, H = 1000;
  scale = Math.min(innerWidth / W, innerHeight / H) * 0.96;
  tx = (innerWidth - W * scale) / 2; ty = (innerHeight - H * scale) / 2 + 10;
  apply();
}
wrap.addEventListener('mousedown', (e) => { pan = { x: e.clientX, y: e.clientY, tx, ty }; wrap.classList.add('panning'); });
window.addEventListener('mousemove', (e) => {
  if (pan) { tx = pan.tx + (e.clientX - pan.x); ty = pan.ty + (e.clientY - pan.y); apply(); }
});
window.addEventListener('mouseup', () => { pan = null; wrap.classList.remove('panning'); });
wrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.12 : 0.89;
  scale = Math.min(3, Math.max(0.2, scale * f));
  tx = e.clientX - (e.clientX - tx) * (f > 1 ? f : 1 / f);
  ty = e.clientY - (e.clientY - ty) * (f > 1 ? f : 1 / f);
  apply();
}, { passive: false });
document.getElementById('zin').onclick = () => { scale = Math.min(3, scale * 1.25); apply(); };
document.getElementById('zout').onclick = () => { scale = Math.max(0.2, scale / 1.25); apply(); };
document.getElementById('zfit').onclick = fit;
setTimeout(fit, 30);
</script>
