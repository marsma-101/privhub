<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg">
  <title>私域枢纽 · PrivHub</title>
  <!-- G2：EasyMDE（Markdown 编辑器增强，替代 textarea；离线单文件） -->
  <link rel="stylesheet" href="/vendor/easymde.min.css">
  <script src="/vue.global.prod.js"></script>
  <script src="/vendor/easymde.min.js"></script>
  <style>
    /* ============ 主题变量（两套护眼配色） ============
     * 【对比度已按 WCAG 2.x 正文门槛 4.5:1 校准，勿凭肉眼回调】FE-03 P0-1。
     * 迁前实测未过线的配对：--muted×3 底 ×2 主题（light 3.25~3.69）、--accent 作文字
     * （light 4.12 / dark 3.44）、主按钮白字（4.12 / 3.31）。字小且全是高频信息
     * （文件大小、次要说明、面包屑），属于"用户不会投诉但会少用"的硬损害。
     * ⚠ --accent 现在只用于【文字/图标/边框】；实心按钮底一律用 --accent-solid
     * （它在两套主题下同值，否则深色主题里白字会掉到 ~2.2:1）。 */
    :root {
      /* --line 是 35 处 1px 边框唯一的来源，迁前对 --panel2 只有 1.35:1 —— 这是
       * 「整页发平、区块分不开」的直接原因。深一档后 1.49:1（对 --bg 1.32）。
       * 刻意不到 2px 宽：全站一起变粗会让整页变「重」，而它缺的只是一点点。*/
      --bg: #eef1f5; --panel: #f7f9fb; --panel2: #ffffff; --line: #ccd4e0;
      --text: #2e3440;
      --muted: #5c6779;          /* 对 --bg 5.05 / --panel 5.42 / --panel2 5.72 */
      --accent: #3a63be;         /* 当文字用：对 --panel2 5.66 / --bg 5.00 */
      --accent-solid: #3a63be;   /* 当实心按钮底用：#fff 在其上 5.66 */
      --accent-hover: #2f559f;
      --danger: #b83c3c;         /* 对 --panel2 5.60 */
      --warn: #b45309;           /* 对 --panel2 5.02 */
      --ok: #1f6b45;             /* 对 --panel2 6.46 / 对 --ok-soft 5.53 */
      /* 四个语义色的「淡底」：语义色当文字压在它上面，两两也要过 4.5:1
       * （实测 danger×danger-soft 4.82、warn×warn-soft 4.58、ok×ok-soft 5.53） */
      --ok-soft: #e2f1e8;
      --warn-soft: #fdf3e6;
      --danger-soft: #fbeaea;
      /* 选中/高亮淡底（FE-03 P0-2）。迁前是 24 处手写的 rgb(90,130,200,α)，α 有 7 种，
       * 且那个蓝【既不是浅色 accent 也不是深色 accent】——于是淡底与它上面的 accent
       * 文字切主题时不同相（一冷一暖）。现在拆两档 + 选区一档，各自跟随本主题。
       * 故意写成具体色值而不是 color-mix()：局域网自部署的浏览器版本不能假设。 */
      --accent-soft: #e7edf9;    /* 选中底：与 --accent 文字对比 4.82:1 */
      --accent-soft-2: #d3dff4;  /* 悬停/边框档 */
      --accent-select: rgba(58,99,190,.25);   /* 文本选区：文字底下那层，与元素底色分开 */
      /* 左栏皮肤（2026-10-14 六版）：**浮雕式（neumorphic）** —— 按钮不描外框、不发外光，
       * 状态只用「投影」表达：常态 = 突起（右下暗 + 左上亮），按下 / 选中 = 陷入（内投影）。
       * 顶栏「欢迎」按钮（.ptab）也用这同一对令牌 —— 两处按钮同属一个家族。
       * 深浅各一套，值都取本主题既有色系，切主题不出现「一冷一暖」的错相。 */
      --abar-top: #fbfcfe; --abar-bot: #e8eef7; --abar-line: #d5dfeb;
      --abar-edge: rgba(58,99,190,.55);
      --abar-chip: rgba(58,99,190,.07);                    /* 悬停时垫的一层很淡的底 */
      --abar-raise: 2px 2px 4px rgba(30,58,110,.22), -2px -2px 5px rgba(255,255,255,.95);
      --abar-press: inset 2px 2px 4px rgba(30,58,110,.28), inset -2px -2px 4px rgba(255,255,255,.95);
      --abar-well-bg: rgba(30,58,110,.11);                 /* 抽屉底板：同一组共用它的底色 */
      --abar-well-line: rgba(58,99,190,.22);
      --abar-well-lip: inset 0 3px 7px rgba(30,58,110,.22); /* 抽屉开口上缘的内投影（凹进去的那道） */
    }
    [data-theme="dark"] {
      --bg: #232834; --panel: #2a3040; --panel2: #333a4a; --line: #4a5568;   /* 对 --panel2 1.51:1 */
      --text: #d7dde8;
      --muted: #9aa4b6;          /* 对 --bg 5.87 / --panel 5.24 / --panel2 4.53 */
      --accent: #7ba6f0;         /* 对 --bg 6.01 / --panel 5.36 / --panel2 4.64 */
      --accent-solid: #3a63be;   /* 与浅色同值：实心底 + 白字在两套主题下都过线 */
      --accent-hover: #4a7bd6;
      --danger: #f08a8a;         /* 对 --panel2 4.72 */
      --warn: #f0a868;           /* 对 --panel2 5.69 */
      --ok: #63c48b;             /* 对 --panel2 5.31 / 对 --ok-soft 5.76 */
      --ok-soft: #1f3a2c;
      --warn-soft: #3d2f1c;      /* warn×warn-soft 6.48 */
      --danger-soft: #4a2a2a;    /* danger×danger-soft 5.26 */
      --accent-soft: #2b3448;    /* 与深色 --accent 文字对比 5.07:1 */
      --accent-soft-2: #354265;
      --accent-select: rgba(123,166,240,.28);
      /* 左栏皮肤（深色）：浮雕靠「更深的暗 + 很淡的亮」成对出现，底比面板更沉一档 */
      --abar-top: #2b3241; --abar-bot: #1f242e; --abar-line: #394354;
      --abar-edge: rgba(123,166,240,.6);
      --abar-chip: rgba(255,255,255,.07);
      --abar-raise: 2px 2px 4px rgba(0,0,0,.55), -2px -2px 5px rgba(255,255,255,.055);
      --abar-press: inset 2px 2px 4px rgba(0,0,0,.62), inset -2px -2px 4px rgba(255,255,255,.055);
      --abar-well-bg: rgba(0,0,0,.30);
      --abar-well-line: rgba(255,255,255,.07);
      --abar-well-lip: inset 0 3px 8px rgba(0,0,0,.62);
    }
    /* ============ 设计令牌：刻度层（FE-03 P1-1） ============
     * 迁前骨架只有 9 个颜色变量，间距/字号/圆角/阴影/层级全是逐处手写的 px 与魔数：
     * 45 个互不相同的 px 值、13 个字号（其中 4 个互相抵消）、17 条阴影、15 个散落的
     * z-index（还带 2 处同值冲突和 1 处跨层倒置）。
     *
     * 【本层的第一原则：只认刻度，不改外观】下面令牌的值一律取「已经存在的那个值」，
     * 因此把某个 px 换成对应令牌，渲染结果【一模一样】。真正的收敛（例如 12.5px 该
     * 砍向 12 还是 13、间距 6px 该不该并进 8px）是【需要眼睛的决策】，全部留白，
     * 见 docs/experts/改进方案/03-refactoring-ui.md 的 P1-1/P1-3。刻度是用来省决策的，
     * 不是用来管束的 —— 徽章内边距、图标字号这类本来就该更小的值保留字面量。 */
    :root {
      /* 间距：4 的倍数台阶；--sp-badge-* 是刻意的例外（徽章不能按刻度撑胖） */
      --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
      --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;
      --sp-badge-y: 2px; --sp-badge-x: 8px;
      /* 字号：--fs-ico 不是文字，是 emoji 字形专用档 */
      --fs-nano: 10px; --fs-xs: 11px; --fs-sm: 12px; --fs-base: 13px;
      --fs-md: 15px;   --fs-lg: 18px; --fs-xl: 22px; --fs-ico: 34px;
      /* 圆角 */
      --r-1: 4px; --r-2: 6px; --r-3: 8px; --r-4: 12px; --r-pill: 999px; --r-full: 50%;
      /* 阴影：色做成变量，深浅两套（深色底上纯黑更省事）。
       * 目前只落在骨架 4 处；插件侧 13 处尚未迁移，深色下不透明度是否要加大
       * （书里的 .20/.32 是估的）留待眼睛验收。 */
      --shadow-rgb: 15 23 42;
      --sh-1: 0 1px 2px rgb(var(--shadow-rgb) / .06), 0 2px 8px rgb(var(--shadow-rgb) / .04);
      --sh-2: 0 2px 4px rgb(var(--shadow-rgb) / .08), 0 10px 24px rgb(var(--shadow-rgb) / .12);
      --sh-3: 0 4px 8px rgb(var(--shadow-rgb) / .10), 0 18px 44px rgb(var(--shadow-rgb) / .20);
      --sh-4: 0 6px 12px rgb(var(--shadow-rgb) / .14), 0 22px 56px rgb(var(--shadow-rgb) / .26);
      /* 层级：一套写下来的契约，替代散落的魔数（FE-03 P2-1）。
       * 两条判断：tooltip(1050) 必须【低于】模态遮罩(1100) —— 当前任务不能被辅助信息
       * 盖住；水印(2100) 必须【最上】—— 它是安全功能，不是装饰。 */
      --z-raised: 100;      /* 卡片内抬升（粘性表头） */
      --z-drawer: 900;      /* 右下角常驻抽屉 / 悬浮球 / 设置按钮 */
      --z-scrim: 1000;      /* 轻遮罩（右键菜单的遮罩） */
      --z-menu: 1010;       /* 轻遮罩之上的菜单（必须高于它自己的遮罩） */
      --z-tooltip: 1050;    /* 悬浮提示 */
      --z-modal: 1100;      /* 模态遮罩（弹窗、整屏编辑器） */
      --z-modal-top: 1150;  /* 模态之上的收尾元素（灯箱关闭按钮） */
      --z-panel: 1300;      /* 管理后台弹层 */
      --z-toast: 1400;      /* 全局提示条 */
      --z-stale: 2000;      /* 版本过期阻断层：压过所有业务弹层，仅低于安全水印 */
      --z-watermark: 2100;  /* 防截屏水印：安全功能，恒在最上 */
      /* 界面缩放：由 设置 → 外观 写入，既有的用户可调项（不要并进上面的刻度） */
      --ui-zoom: 1;
    }
    [data-theme="dark"] { --shadow-rgb: 0 0 0; }

    /* ============================================================
     * 交互原型令牌层（issue #3《PrivHub-导航简化方案-交互原型.html》）
     *
     * 主子要求：界面/位置/样式先按原型走，功能比原型多、按文字规则安置。
     * 这里把原型的视觉语言（indigo→cyan 主色族、左 rail 驾驶舱、卡片色脊、
     * 渐变实底 tab、右侧抽屉）落成一套**带命名空间的令牌**（--p-*），
     * 与既有 WCAG 校准令牌（--accent/--panel/…）并存：
     *   · 原型令牌只服务「按原型走」的新表面（rail / 驾驶舱 / 项目 tab / 我的）；
     *   · 既有令牌继续服务全部业务插件（文件/知识/管理/设置），不删不改，
     *     避免一处换肤把几十个插件的对比度一起拉下水。
     * 两套主题各自覆盖，切主题不出现「一冷一暖」的错相。
     * ============================================================ */
    :root {
      --p-indigo: #4f46e5; --p-blue: #2563eb; --p-cyan: #0891b2;
      --p-green: #16a34a; --p-amber: #d97706; --p-red: #dc2626;
      --p-magenta: #db2777; --p-violet: #7c3aed;
      --p-bg: #eef1f8; --p-surface: #ffffff; --p-surface2: #f5f7fc;
      --p-overlay: #ffffff; --p-border: #dfe5f0;
      --p-text: #141d33; --p-muted: #566381; --p-faint: #8b97b0;
      --p-rail-w: 212px; --p-top-h: 56px;
      --p-shadow: 0 12px 32px rgba(20,29,51,.12);
      --p-shadow-sm: 0 2px 8px rgba(20,29,51,.06);
      --p-grad: linear-gradient(135deg, var(--p-indigo), var(--p-cyan));
      --p-grad-btn: linear-gradient(135deg, var(--p-indigo), var(--p-blue));
    }
    [data-theme="dark"] {
      --p-indigo: #818cf8; --p-blue: #60a5fa; --p-cyan: #22d3ee;
      --p-green: #4ade80; --p-amber: #fbbf24; --p-red: #f87171;
      --p-magenta: #f472b6; --p-violet: #a78bfa;
      --p-bg: #0b0f16; --p-surface: #141b26; --p-surface2: #1a2432;
      --p-overlay: #1c2635; --p-border: #2c3a4e;
      --p-text: #e8eef6; --p-muted: #93a1b5; --p-faint: #5f6d80;
      --p-shadow: 0 12px 34px rgba(0,0,0,.5);
      --p-shadow-sm: 0 2px 10px rgba(0,0,0,.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); height: 100%; overflow: hidden;
      transition: background .25s, color .25s;
    }

    /* ============ 登录/注册 ============ */
    .auth-wrap { height: 100vh; display: flex; align-items: center; justify-content: center; }
    .auth-card {
      background: var(--panel2); border: 1px solid var(--line); border-radius: var(--r-4);
      padding: 36px 32px; width: 360px; box-shadow: var(--sh-4);
    }
    .auth-card h1 { font-size: 20px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
    .logo-dot { width: 12px; height: 12px; border-radius: var(--r-full); background: var(--accent); display: inline-block; }
    .auth-sub { color: var(--muted); font-size: var(--fs-base); margin-bottom: 22px; }
    .field { margin-bottom: 13px; }
    .field label { display: block; font-size: var(--fs-sm); color: var(--muted); margin-bottom: 5px; }
    .field input {
      width: 100%; padding: 9px 12px; background: var(--bg); border: 1px solid var(--line);
      border-radius: var(--r-2); color: var(--text); font-size: 14px; outline: none;
    }
    .field input:focus { border-color: var(--accent); }
    .field-hint { font-size: var(--fs-xs); color: var(--muted); margin-top: 5px; line-height: 1.6; }

    /* ============ 智能体接入（开发者平台） ============ */
    .ac-card { border: 1px solid var(--line); border-radius: var(--r-3); padding: 14px 16px; margin-bottom: 14px; }
    .ac-card-title { font-size: var(--fs-base); font-weight: 600; margin-bottom: 10px; }
    .ac-grid { display: flex; flex-direction: column; gap: 7px; }
    .ac-kv { display: flex; gap: 10px; font-size: var(--fs-base); align-items: baseline; }
    .ac-kv .k { color: var(--muted); flex: 0 0 108px; }
    .ac-kv .v { flex: 1; word-break: break-all; }
    .ac-kv code, .ac-hint code, .ac-pre { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
    .ac-hint { font-size: var(--fs-sm); color: var(--muted); margin-top: 10px; line-height: 1.7; }
    .ac-warn { font-size: var(--fs-sm); color: var(--warn); margin-top: 10px; line-height: 1.7; }
    .ac-fresh { border-color: var(--warn); background: rgba(200,150,60,.08); }
    .ac-keyrow { display: flex; gap: var(--sp-2); align-items: center; margin-top: 10px; flex-wrap: wrap; }
    .ac-key { flex: 1; min-width: 240px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-2); word-break: break-all; }
    /* JT-19：接入信息卡里的「自检命令」一行——可复制，紧跟在密钥字段下方 */
    .ac-cmdrow { display: flex; gap: var(--sp-2); align-items: stretch; margin-top: 10px; }
    .ac-cmd { flex: 1; min-width: 0; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-2); overflow-x: auto; white-space: pre; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
    .ac-tabs { display: flex; gap: var(--sp-1); border-bottom: 1px solid var(--line); margin: 6px 0 14px; }
    .ac-tab { padding: 7px 14px; font-size: var(--fs-base); color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
    .ac-tab:hover { color: var(--text); }
    .ac-tab.on { color: var(--accent); border-bottom-color: var(--accent); }
    .ac-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
    .ac-form input, .ac-form select { width: 100%; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-2); color: var(--text); font-size: var(--fs-base); outline: none; }
    .ac-status { font-size: var(--fs-sm); padding: 1px 7px; border-radius: 10px; }
    .ac-status.on { color: #3f9d63; background: rgba(63,157,99,.14); }
    .ac-status.off { color: var(--muted); background: rgba(128,128,128,.14); }
    .ac-dim { color: var(--muted); font-size: var(--fs-sm); }
    /* FE-06：本面板以前借用了 explorer-v3 宿主的 .v3-loading 类 —— 跨插件 DOM 耦合一例
     * （explorer-v3 一改类名/不在场，这里就静默失去样式）。改成自己的 .ac-loading。 */
    .ac-loading { color: var(--muted); font-size: var(--fs-base); padding: 60px 0; text-align: center; }
    .ac-codes { display: flex; flex-direction: column; gap: var(--sp-1); font-size: 12.5px; }
    .ac-code { display: flex; gap: 10px; }
    .ac-code code { flex: 0 0 92px; color: var(--muted); }
    .ac-pre { margin-top: var(--sp-2); padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-2); overflow-x: auto; white-space: pre; }
    .btn { padding: 10px 16px; border-radius: var(--r-2); border: none; cursor: pointer; font-size: var(--fs-base); }
    /* 实心按钮底走 --accent-solid（FE-03 P0-1）；hover 用换底色而不是 filter——
     * filter 会把 #fff 文字一起压暗，属于"改一个坏一个"。 */
    .btn-primary { background: var(--accent-solid); color: #fff; width: 100%; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); }
    .auth-err { color: var(--danger); font-size: var(--fs-sm); margin-top: 10px; min-height: 16px; }
    .auth-switch { margin-top: 14px; text-align: center; font-size: var(--fs-sm); color: var(--muted); }
    .auth-switch a { color: var(--accent); cursor: pointer; }
    /* JT-19：匿名面接入指路（低权重小字，不抢登录表单的注意力） */
    .auth-hint {
      margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line);
      text-align: center; font-size: var(--fs-xs, 12px); color: var(--muted); line-height: 1.7;
    }
    .auth-hint code { font-size: var(--fs-xs, 12px); color: var(--text); }

    /* ============ 主界面 ============ */
    /* 整体缩放（页面字体 A−/A+）：html zoom 下 vh 不随缩放收缩，这里按比例补偿高度，避免整页纵向滚动/底部截断 */
    .app {
      display: flex; flex-direction: column;
      height: calc(100vh / var(--ui-zoom, 1));
      min-height: 0;
    }
    .topbar {
      display: flex; align-items: center; gap: var(--sp-3); padding: 10px 16px;
      background: var(--panel2); border-bottom: 1px solid var(--line);
    }
    .logo { font-weight: 700; font-size: var(--fs-md); color: var(--text); display: flex; align-items: center; gap: var(--sp-2); }
    .tp-right { margin-left: auto; display: flex; align-items: center; gap: var(--sp-3); }
    .badge { font-size: var(--fs-sm); padding: 3px 11px; border-radius: 20px; background: var(--accent-soft); color: var(--accent); }
    .badge.admin { background: rgba(192,122,43,.15); color: var(--warn); }
    .avatar { width: 30px; height: 30px; border-radius: var(--r-full); background: var(--accent-solid); display: flex; align-items: center; justify-content: center; font-size: var(--fs-base); color: #fff; font-weight: 600; }
    .icon-btn { font-size: var(--fs-sm); padding: 6px 12px; border-radius: var(--r-2); background: transparent; border: 1px solid var(--line); color: var(--muted); cursor: pointer; }
    .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
    .icon-btn.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

    .body { display: flex; flex: 1; overflow: hidden; }
    /* A2：左面板宽度由骨架外层容器控制（可拖拽/折叠），内部组件撑满 */
    .sidebar {
      width: 100%; height: 100%; background: var(--panel);
      padding: 12px 10px; display: flex; flex-direction: column; overflow-y: auto;
    }
    /* A2：左面板拖拽条 */
    .resize-handle {
      flex: 0 0 4px; cursor: col-resize; background: transparent;
      transition: background .15s;
    }
    .resize-handle:hover { background: var(--accent); opacity: .5; }
    /* 侧边栏收起时的展开按钮（固定细条） */
    .side-expand {
      flex: 0 0 18px; border: none; background: transparent; color: var(--muted);
      cursor: pointer; font-size: var(--fs-sm); border-right: 1px solid var(--line);
    }
    .side-expand:hover { color: var(--accent); background: var(--panel2); }
    .side-head { display: flex; justify-content: flex-start; align-items: center; gap: 6px; margin-bottom: var(--sp-2); }
    .side-title { font-size: var(--fs-sm); color: var(--muted); letter-spacing: .05em; }
    .tree-item { display: flex; align-items: center; gap: var(--sp-2); padding: 8px 10px; border-radius: var(--r-2); font-size: 13.5px; cursor: pointer; }
    .tree-item:hover { background: var(--panel2); }
    .tree-item.active { background: var(--accent-soft); color: var(--accent); }
    .tree-item .name { flex: 1; }
    .main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    .main-welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); gap: 14px; }
    /* 欢迎页项目选择（左侧目录树取消后，未选项目时在这里挑项目） */
    .welcome-projects { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 640px; margin-top: 6px; }
    .welcome-project {
      padding: 10px 18px; border-radius: 10px; border: 1px solid var(--p-border, var(--line));
      background: var(--p-surface, var(--panel2)); color: var(--p-text, var(--text));
      font-size: 13.5px; cursor: pointer; transition: .15s;
    }
    .welcome-project:hover { border-color: var(--p-indigo, var(--accent)); color: var(--p-indigo, var(--accent)); transform: translateY(-2px); box-shadow: var(--p-shadow-sm, var(--sh-2)); }
    .welcome-project:focus-visible { outline: 2px solid var(--p-indigo, var(--accent)); outline-offset: 2px; }
    .main-welcome .big { font-size: var(--fs-xl); color: var(--text); }
    /* 项目选择栏（shell 插件 welcome：未选项目时左侧栏显示，选中后变目录树） */
    .project-sidebar .project-list { display: flex; flex-direction: column; gap: 2px; }
    .project-item .pc-go { color: var(--muted); font-size: var(--fs-sm); opacity: 0; transition: opacity .15s; }
    .project-item:hover .pc-go { opacity: 1; color: var(--accent); }
    .project-sidebar .side-foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); }
    .project-empty { font-size: 12.5px; color: var(--muted); padding: 10px 4px; line-height: 1.6; }
    .main-head { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: var(--sp-3); }
    .main-head .title { font-size: var(--fs-md); font-weight: 600; }
    .main-head .crumb { color: var(--muted); font-size: var(--fs-base); }
    .breadcrumb { font-size: 14px; display: flex; align-items: center; gap: 2px; }
    .breadcrumb a { color: var(--accent); }
    .breadcrumb a:hover { text-decoration: underline; }
    .main-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .file-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--sp-3); }
    .file-card {
      background: var(--panel2); border: 1px solid var(--line); border-radius: var(--r-3);
      padding: var(--sp-4) var(--sp-3); text-align: center; cursor: pointer; position: relative;
    }
    .file-card:hover { border-color: var(--accent); }
    .file-card.sel { border-color: var(--accent); background: var(--accent-soft); }
    .file-ico { font-size: var(--fs-ico); margin-bottom: var(--sp-2); }
    .file-name { font-size: 12.5px; word-break: break-all; }
    .file-meta { font-size: var(--fs-xs); color: var(--muted); margin-top: var(--sp-1); }
    /* 列表视图（Windows 详细信息风格） */
    .file-table-wrap { display: flex; flex-direction: column; }
    .file-table-head, .file-table-row {
      display: grid; grid-template-columns: 1fr 90px 120px 110px; gap: var(--sp-2);
      padding: var(--sp-2) var(--sp-3); align-items: center; font-size: var(--fs-base);
    }
    .file-table-head { color: var(--muted); font-size: var(--fs-sm); border-bottom: 1px solid var(--line); }
    .file-table-row { border-bottom: 1px solid var(--line); cursor: pointer; }
    .file-table-row:hover { background: var(--panel2); }
    .file-table-row.sel { background: var(--accent-soft); }
    .col-name { display: flex; align-items: center; gap: var(--sp-2); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .tico { flex-shrink: 0; }
    .col-size, .col-type { color: var(--muted); }
    .col-time { color: var(--muted); }
    .empty { color: var(--muted); font-size: var(--fs-base); text-align: center; padding: 40px 0; }
    .spacer { flex: 1; }

    /* 设置入口（左下角） */
    .settings-fab {
      position: fixed; left: 14px; bottom: 14px; z-index: var(--z-drawer);
      padding: 9px 14px; border-radius: var(--r-3); background: var(--panel2); border: 1px solid var(--line);
      color: var(--muted); font-size: var(--fs-base); cursor: pointer; display: flex; align-items: center; gap: 6px;
    }
    .settings-fab:hover { color: var(--accent); border-color: var(--accent); }

    /* ============ 骨架：顶栏项目横排 + 工作区图标栏 ============ */
    .project-tabs { display: flex; align-items: center; gap: var(--sp-1); margin-left: 14px; flex: 1; overflow-x: auto; scrollbar-width: none; }
    /* 顶栏「欢迎」按钮：与图标栏同属一个按钮家族（2026-10-14 六版，用户：也做一下相同的改变）——
     * 状态同样**只用投影**表达：常态突起、选中按下，不再靠底色 + 描边。
     * 图标单列一个置位 `.ptab-ico`：否则它会跟着正文一起缩到 --fs-base(13px)，
     * 比图标栏里的图标小一大圈，两处看着不像一套。 */
    .ptab {
      flex-shrink: 0; padding: 6px 15px; border-radius: var(--r-3); font-size: var(--fs-base); cursor: pointer;
      color: var(--muted); background: transparent; border: 1px solid transparent; white-space: nowrap;
      display: flex; align-items: center; gap: 7px;
      box-shadow: var(--abar-raise);
      transition: color .16s, box-shadow .16s;
    }
    .ptab-ico { font-size: 18px; line-height: 1; }
    .ptab:hover { color: var(--text); background: var(--abar-chip); }
    .ptab.on { color: var(--accent); font-weight: 600; box-shadow: var(--abar-press); }
    .plus-btn {
      flex-shrink: 0; width: 26px; height: 26px; margin-left: var(--sp-1); border-radius: var(--r-full);
      background: var(--accent-solid); color: #fff; border: none; font-size: var(--fs-md); line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .plus-btn:hover { background: var(--accent-hover); }
    .uname { font-size: var(--fs-base); color: var(--text); }
    /* 项目下拉（项目多时替代横排，避免溢出） */
    .project-select-wrap { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .project-select-label { font-size: var(--fs-base); color: var(--muted); white-space: nowrap; }
    .project-select {
      padding: 6px 10px; border-radius: var(--r-3); border: 1px solid var(--line); font-size: var(--fs-base);
      background: var(--panel); color: var(--text); max-width: 200px; cursor: pointer; outline: none;
    }
    .project-select:hover { border-color: var(--accent); }
    /* 图标栏（只显示图标：一级=功能类别·手风琴；二级=类别下的功能；底部系统组）。
     * 由 privhub-shell 的 AppIconbar 渲染；这里只管样式。
     * 视觉方向（2026-10-14 六版）：**浮雕式图标栏** —— 竖向渐变底 + 右缘一条渐隐的发光细线（HUD 电源线）；
     *   栏内不出现任何文字：名称走原生悬停提示（title）+ 无障碍名（aria-label），更简洁。
     *   状态**不画外框、不发外光，只用投影表达**（用户指定）：
     *     常态 / 未选中 = 突起（右下暗、左上亮的外部投影）；
     *     按下 / 选中   = 陷入（同样两个方向，但收进盒子内部的 inset 投影）。
     *   展开的类别 = 一只**抽屉**：把手与抽屉同宽、下缘取直、共用同一块比栏面更暗的底板，
     *     底板开口上缘有一道内投影（像是真凹进去）—— 组内按钮一眼看出属于上面那个类别，
     *     不会跟下一组串味。（把手与抽屉是一块，故把手用「开口上缘」的内投影而不是通用按下投影，
     *     否则它下缘会亮起一道边，把一整块切开。）
     *   收起时抽屉高度归零（底板一起被 overflow 剪掉），动画由 max-height 承担。
     * 尺寸（2026-10-14 六版，用户要求「更自然」）：各级按钮一律**近似方形**，
     *   不再「宽而扁」——把手 46×44、条目 42×42、抽屉内条目 38×36；图标字号取盒高的
     *   4~6 成（22 / 18 / 16px），既不缩成一点、也不顶满盒子。栏宽 62px 比最宽的把手
     *   （46px）宽出一圈留白 —— 投影不会被栏边裁切，展开动画也不会互相遮挡。
     * 项目选择【不在】栏内（顶栏已有欢迎按钮与项目下拉）。
     * 深浅两套皮肤令牌见 :root / [data-theme="dark"]（--abar-*）。*/
    .appbar {
      width: 62px; flex: 0 0 auto; position: relative;
      background: linear-gradient(180deg, var(--abar-top) 0%, var(--abar-bot) 100%);
      border-right: 1px solid var(--abar-line);
      display: flex; flex-direction: column; align-items: center; padding: 8px 0 8px; overflow: hidden;
    }
    /* 右缘渐隐发光细线：HUD 的「电源线」（贴着 border-right，须落在 appbar 内才不被 overflow 裁掉） */
    .appbar::after {
      content: ''; position: absolute; top: 0; right: 0; width: 1px; height: 100%;
      background: linear-gradient(180deg, transparent, var(--abar-edge) 32%, var(--abar-edge) 68%, transparent);
      pointer-events: none;
    }
    /* 分隔线：中间亮、两端渐隐 */
    .abar-sep { height: 1px; width: 46px; background: linear-gradient(90deg, transparent, var(--abar-line), transparent); margin: 9px 0; flex: 0 0 auto; }
    /* 中段可滚动：类别 + 条目（滚动条走全站标准 .ph-scroll；纵向单列居中） */
    .abar-scroll {
      flex: 1 1 auto; min-height: 0; width: 100%; padding: 2px 0;
      overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; align-items: center;
    }
    /* 左栏是独立皮肤：滑块色沿用 --abar-line（比 --line 更淡，压在深色栏上不刺眼），
       其余（6px 粗细 / 右下 2px 投影 / hover 变深）全部继承全站标准。 */
    .abar-scroll.ph-scroll::-webkit-scrollbar-thumb { background: var(--abar-line); }
    /* 类别（一级）= 抽屉的把手：**只显示图标，无箭头、无文字**。
     *   常态 = 突起的浮雕按钮；展开 = 与抽屉共用底板、陷入（开口上缘内投影）、下缘取直。*/
    .abar-sec { display: flex; flex-direction: column; align-items: center; width: 100%; }
    .abar-head {
      width: 46px; height: 44px; display: grid; place-items: center;
      border-radius: var(--r-3); cursor: pointer; user-select: none;
      color: var(--muted); font-size: 22px;
      background: transparent; box-shadow: var(--abar-raise);
      transition: color .18s, background .18s, box-shadow .18s, border-radius .18s;
    }
    .abar-head:hover { color: var(--text); }
    .abar-head.on {
      color: var(--accent); background: var(--abar-well-bg);
      border-bottom-left-radius: 0; border-bottom-right-radius: 0;
      box-shadow: var(--abar-well-lip);
    }
    .abar-head:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    /* 抽屉容器：只管「收合」—— 高度归零 + overflow 剪裁，动画由它承担。
     *   （底板与按钮都画在里面，收起来时整体被剪掉，不留残边。）*/
    .abar-sub {
      width: 100%; overflow: hidden; max-height: 0;
      transition: max-height .26s cubic-bezier(.4, 0, .2, 1);
    }
    /* 320 → 460：段内多了「更多」一层（常用 2 + 把手 + 低频若干），
     * 旧上限会把展开的低频区裁掉一半 —— 折叠动画的上限必须容得下最深的展开态。 */
    .abar-sub.open { max-height: 460px; }
    .abar-sub .abar-item { opacity: 0; transform: translateY(-4px); }
    .abar-sub.open .abar-item { opacity: 1; transform: none; }
    /* 抽屉本体：同一组共用的一块**凹陷**底板（比栏面暗 + 内凹描边），顶边不封，
     *   与上面同宽的把手接成一体，看上去就是把手拉出来的那个抽屉。
     *   overflow 剪裁：组内按钮的浮雕投影不越出底板，才像「嵌在抽屉里」。*/
    .abar-drawer {
      width: 46px; margin: 0 auto; padding: 5px 0 6px; overflow: hidden;
      display: flex; flex-direction: column; align-items: center;
      background: var(--abar-well-bg); border: 1px solid var(--abar-well-line); border-top: none;
      border-radius: 0 0 var(--r-3) var(--r-3);
    }
    /* 条目：只有图标（名称走原生 title 悬停提示，不再画文字）。
     *   底是透明的 —— 形状全由投影给出：常态突起、选中陷入。*/
    .abar-item {
      width: 42px; height: 42px; display: grid; place-items: center; margin: 3px 0;
      border-radius: var(--r-2); cursor: pointer; color: var(--text); font-size: 18px;
      position: relative;                 /* 角标（回收站计数）以它为准定位 */
      background: transparent; box-shadow: var(--abar-raise);
      transition: background .16s, color .16s, box-shadow .16s, opacity .2s, transform .2s;
    }
    .abar-item:hover { background: var(--abar-chip); }
    .abar-item.on { color: var(--accent); box-shadow: var(--abar-press); }
    .abar-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    /* 抽屉里的按钮：同一套浮雕规则，只是底换成了抽屉底板（常态突起、选中陷入）。*/
    .abar-drawer .abar-item { width: 38px; height: 36px; margin: 3px 0; font-size: 16px; }

    /* ---- 段内「更多」：低频功能的第二层深度（issue #3「频率决定位置」）----
     * 一条硬约束：低频只下沉、不删除。条目仍在 items 里、仍可点、仍有说明气泡，
     * 只是不占常用位。收起时用 visibility:hidden 一并移出 Tab 序 ——
     * 只靠 max-height:0 会留下「看不见但能 Tab 到」的幽灵焦点。 */
    .abar-more-head {
      width: 38px; height: 22px; margin: 2px 0 1px; display: grid; place-items: center;
      position: relative; border-radius: var(--r-2); cursor: pointer; user-select: none;
      color: var(--muted); background: transparent;
      transition: color .16s, background .16s;
    }
    .abar-more-head:hover { color: var(--text); background: var(--abar-chip); }
    .abar-more-head.on { color: var(--accent); }
    .abar-more-head:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .abar-more-ico { font-size: 11px; line-height: 1; }
    /* 低频区里藏着当前视图时点一下红点：告诉人「你在这儿，只是被收起来了」 */
    .abar-more-dot {
      position: absolute; top: 2px; right: 3px; width: 5px; height: 5px;
      border-radius: var(--r-full); background: var(--accent);
    }
    .abar-more {
      width: 100%; max-height: 0; overflow: hidden; visibility: hidden;
      display: flex; flex-direction: column; align-items: center;
      transition: max-height .24s cubic-bezier(.4, 0, .2, 1), visibility .24s;
    }
    .abar-more.open { max-height: 260px; visibility: visible; }
    /* 更深一层的条目略小、略淡：深度靠尺寸与明度表达，不靠新增配色 */
    .abar-drawer .abar-item-deep { width: 34px; height: 32px; font-size: 15px; opacity: .92; }
    .abar-bottom { flex: 0 0 auto; }
    .abar-badge {
      position: absolute; top: 1px; right: 1px; min-width: 14px; height: 14px; border-radius: var(--r-3);
      background: var(--danger); color: #fff; font-size: var(--fs-nano); line-height: 14px; text-align: center; padding: 0 3px;
      box-shadow: 0 0 8px -2px var(--danger);
    }

    /* ============ 图标栏悬停说明气泡 ============
     * 由 shell 的 AppIconbar 渲染，teleport 到 body（appbar overflow:hidden 会裁掉栏内气泡）。
     * 位置由被悬停元素的 boundingRect 推出（position:fixed）。条目 manifest 声明 desc 才弹；
     * 没 desc 的退回原生 title，行为与迁前一致。 */
    .ph-help {
      position: fixed; z-index: var(--z-tooltip); max-width: 300px;
      background: var(--panel2); color: var(--text); border: 1px solid var(--line);
      border-radius: var(--r-3); box-shadow: var(--sh-2); padding: 10px 12px;
      font-size: var(--fs-sm); line-height: 1.5;
    }
    .ph-help-head { display: flex; align-items: center; gap: 6px; font-weight: 600; margin-bottom: 4px; }
    .ph-help-ico { font-size: 15px; }
    .ph-help-desc { opacity: .88; }
    .ph-help-foot { margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--line); }
    .ph-help-more { color: var(--accent); cursor: pointer; text-decoration: none; }
    .ph-help-more:hover { text-decoration: underline; }
    .ph-help-hint { color: var(--muted); }

    /* 页内「功能说明」小标（?）：贴在被说明的文字 / 按钮右侧，点开是一个悬浮窗，
     * 讲「这个功能是干啥的 / 怎么用」，并给「查看完整说明」入口跳到站内说明文档。
     * 骨架级全局组件 <ph-help>（各插件页面复用；RAG 插件原有的同款交互是它的前身）。 */
    .ph-hb {
      display: inline-flex; align-items: center; justify-content: center;
      width: 15px; height: 15px; margin-left: 5px; border-radius: 50%;
      font-size: 11px; font-weight: 700; line-height: 1; cursor: pointer;
      color: var(--muted); background: var(--bg); border: 1px solid var(--line);
      vertical-align: middle; user-select: none; flex: 0 0 auto;
    }
    .ph-hb:hover { color: var(--accent); border-color: var(--accent); }
    /* 点开时的透明遮罩：点空白处关闭（在悬浮窗之下、页面之上） */
    .ph-hb-mask { position: fixed; inset: 0; z-index: var(--z-scrim); }
    .ph-hb-pop {
      position: fixed; z-index: var(--z-tooltip); width: 320px; max-width: 92vw;
      max-height: 70vh; overflow: auto;
      background: var(--panel2); color: var(--text); border: 1px solid var(--line);
      border-radius: var(--r-3); box-shadow: var(--sh-2); padding: 12px 14px;
      font-size: var(--fs-sm); line-height: 1.6;
    }
    .ph-hb-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
    .ph-hb-head b { font-size: var(--fs-base); color: var(--accent); }
    .ph-hb-x { cursor: pointer; color: var(--muted); }
    .ph-hb-x:hover { color: var(--danger); }
    .ph-hb-desc { opacity: .9; }
    .ph-hb-steps { margin: 8px 0 0; padding-left: 20px; }
    .ph-hb-steps li { margin: 3px 0; }
    .ph-hb-tips { margin-top: 8px; padding: 7px 9px; background: var(--bg); border-radius: var(--r-2); color: var(--muted); }
    .ph-hb-foot { margin-top: 9px; padding-top: 7px; border-top: 1px solid var(--line); }

    /* 说明文档弹层（骨架级：nav.openHelp 打开，复用 .modal 外壳 + .ph-doc 正文样式） */
    .ph-doc { overflow: auto; font-size: var(--fs-base); line-height: 1.65; }
    .ph-doc h1, .ph-doc h2, .ph-doc h3, .ph-doc h4 { margin: 14px 0 8px; line-height: 1.4; }
    .ph-doc h1 { font-size: var(--fs-xl); border-bottom: 1px solid var(--line); padding-bottom: 6px; }
    .ph-doc h2 { font-size: var(--fs-lg); }
    .ph-doc h3 { font-size: 16px; }
    .ph-doc p { margin: var(--sp-2) 0; }
    .ph-doc ul, .ph-doc ol { padding-left: 22px; margin: var(--sp-2) 0; }
    .ph-doc li { margin: 3px 0; }
    .ph-doc code { background: var(--bg); padding: 1px 5px; border-radius: var(--r-1); font-family: Consolas, monospace; font-size: var(--fs-base); }
    .ph-doc pre { background: #1e1e2e; color: #e4e4e7; padding: 12px 14px; border-radius: var(--r-3); overflow: auto; }
    .ph-doc pre code { background: none; padding: 0; color: inherit; }
    .ph-doc table { border-collapse: collapse; margin: 10px 0; width: 100%; }
    .ph-doc th, .ph-doc td { border: 1px solid var(--line); padding: 5px 10px; font-size: var(--fs-base); text-align: left; }
    .ph-doc th { background: var(--bg); }
    .ph-doc blockquote { border-left: 3px solid var(--accent); margin: var(--sp-2) 0; padding: 2px 12px; color: var(--muted); background: var(--bg); border-radius: 0 var(--r-2) var(--r-2) 0; }
    .ph-doc hr { border: none; border-top: 1px solid var(--line); margin: var(--sp-3) 0; }
    .ph-doc a { color: var(--accent); text-decoration: none; border-bottom: 1px dashed var(--accent); cursor: pointer; }

    /* ============ 右侧预览容器 ============ */
    .right-panel { width: 340px; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; overflow: hidden; }
    .right-head { padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--line); font-size: var(--fs-base); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .right-close { cursor: pointer; color: var(--muted); }
    .right-close:hover { color: var(--danger); }
    .right-body { flex: 1; overflow: auto; padding: 14px 16px; }
    .preview-img { max-width: 100%; border-radius: var(--r-3); }
    .preview-text { font-size: 12.5px; white-space: pre-wrap; word-break: break-all; color: var(--text); }
    .preview-pdf { width: 100%; height: 480px; border: 1px solid var(--line); border-radius: var(--r-3); }
    .preview-empty { color: var(--muted); font-size: var(--fs-sm); text-align: center; padding: 40px 0; }

    /* ============ 长按菜单 ============ */
    .ctx-menu { position: fixed; z-index: var(--z-menu); background: var(--panel2); border: 1px solid var(--line); border-radius: var(--r-3); padding: 6px 0; box-shadow: var(--sh-2); min-width: 150px; }
    .ctx-item { padding: 9px 16px; font-size: var(--fs-base); cursor: pointer; display: flex; align-items: center; gap: 10px; }
    .ctx-item:hover { background: var(--panel); }
    .ctx-item.danger { color: var(--danger); }
    /* 长按菜单遮罩：点空白处关闭菜单（透明，仅拦截点击） */
    .ctx-mask { position: fixed; inset: 0; z-index: var(--z-scrim); }

    /* ============ 弹窗 ============ */
    /* G2：EasyMDE 编辑器深色适配（CodeMirror 默认浅色，覆盖为跟随主题） */
    .EasyMDEContainer .CodeMirror { background: var(--panel2); color: var(--text); border-color: var(--line); }
    .EasyMDEContainer .editor-toolbar { background: var(--bg); border-color: var(--line); }
    .EasyMDEContainer .editor-toolbar button { color: var(--muted); }
    .EasyMDEContainer .editor-toolbar button:hover, .EasyMDEContainer .editor-toolbar button.active { background: var(--panel); color: var(--accent); border-color: var(--accent); }
    .EasyMDEContainer .CodeMirror-cursor { border-color: var(--text); }
    .EasyMDEContainer .CodeMirror-selected { background: var(--accent-select); }
    .EasyMDEContainer .editor-statusbar { color: var(--muted); }
    .EasyMDEContainer .CodeMirror .cm-header { color: var(--accent); }
    .EasyMDEContainer .CodeMirror .cm-quote { color: var(--muted); font-style: italic; }
    .EasyMDEContainer .CodeMirror .cm-link { color: var(--accent); }
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: var(--z-modal); }
    /* 蓝绿热更新：旧页面阻断层。必须压过 md/office 编辑器与所有业务弹层，
     * 否则用户能在「已过期」的页面上继续点写操作（请求会被后端 409 拒绝）。 */
    .privhub-version-mask { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: var(--z-stale); }
    .privhub-version-card { width: 420px; max-width: 92vw; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: var(--r-4); padding: var(--sp-5); box-shadow: var(--sh-3); text-align: center; }
    .privhub-version-title { font-size: var(--fs-lg); font-weight: 600; margin-bottom: var(--sp-3); }
    .privhub-version-text { font-size: var(--fs-base); color: var(--muted); line-height: 1.7; margin-bottom: var(--sp-5); }
    .modal { background: var(--panel2); border: 1px solid var(--line); border-radius: var(--r-4); width: 460px; max-width: 92vw; max-height: 86vh; padding: 22px; box-shadow: var(--sh-3); display: flex; flex-direction: column; }
    .modal h2 { font-size: 16px; margin-bottom: var(--sp-4); }
    .modal-body { flex: 1; overflow-y: auto; }
    .modal-foot { margin-top: var(--sp-4); display: flex; gap: 10px; justify-content: flex-end; }
    /* 功能面板视图（⑤：设置/用户管理/权限/审计/标签/模板/图谱/知识库）
       对齐 llm_wiki：面板 = main 全宽视图，独占主区；内容限宽居中 */
    .view-page { height: 100%; width: 100%; display: flex; flex-direction: column; overflow: hidden; }
    /* overflow-y:auto 而不是 hidden：面板的两种写法都要能滚。
       (a) `view-inner > h2 + 内容`（如功能权限开关、Webhook 订阅）——没有内层滚动容器，
           靠这里滚；写 hidden 时内容一长就被裁掉、页面没有滚动条。
       (b) `view-inner > .modal-body`（多数面板）——.modal-body 是 flex:1/min-height:0，
           自己吃掉剩余高度并内部滚动，外层不会溢出，因此不会出现双滚动条。
       overflow-x 保持隐藏：横向溢出（超宽表格）本来就不该把整页顶出横向滚动条。 */
    .view-inner {
      flex: 1; display: flex; flex-direction: column; overflow-x: hidden; overflow-y: auto; min-height: 0;
      width: 100%; max-width: 1100px; margin: 0 auto;
      padding: 20px 24px; background: var(--panel2);
    }
    .view-inner h2 { font-size: 16px; margin-bottom: var(--sp-4); }
    .view-inner .modal-body { flex: 1; min-height: 0; }
    .view-inner .modal-foot { margin-top: var(--sp-4); display: flex; gap: 10px; justify-content: flex-end; }

    /* ============ 全站细滚动条（唯一标准，页面只挂类名 ph-scroll） ============
       任何自带滚动的容器（看板视口、面板 body、浮层……）都加 class="ph-scroll"，
       不要再各写一套 —— 全站粗细、颜色、投影、悬停表现必须一致。

       ⚠ 一个必须避开的坑：标准属性 scrollbar-width / scrollbar-color 一旦被声明，
       Chromium 会**整体忽略** ::-webkit-scrollbar 的全部样式，退回带上下箭头的经典
       滚动条（又宽又丑）。而 CSS.supports('selector(::-webkit-scrollbar)') 在 Chromium
       里返回 true，没法当开关使。所以这里：
         · 主路径 = ::-webkit-scrollbar* （Chromium/Edge/Safari）
         · 标准属性只放进 @supports not selector(...) （即 Firefox）做回退
       —— 两者互斥地写在同一条元素上，才不会互相抵消。 */
    /* 选择器写成 :is(.ph-scroll, .view-inner, .main-body, .modal-body)：后三个都是骨架自有类
       —— .view-inner 是全部面板页的滚动容器，.main-body 是左侧各面板（搜索/收藏/回收站…）的，
       .modal-body 是弹窗的。并入同一条规则，这些页面不必各自再挂 ph-scroll，标准也只有这一份。 */
    :is(.ph-scroll, .view-inner, .main-body, .modal-body)::-webkit-scrollbar { width: 6px; height: 6px; }
    :is(.ph-scroll, .view-inner, .main-body, .modal-body)::-webkit-scrollbar-track { background: transparent; }
    /* 滑块右下 2px 小投影：让 6px 的细条从内容里「浮」出来一点点（很轻，不喧宾夺主） */
    :is(.ph-scroll, .view-inner, .main-body, .modal-body)::-webkit-scrollbar-thumb {
      background: var(--line); border-radius: var(--r-pill);
      box-shadow: 2px 2px 2px rgb(var(--shadow-rgb) / .40);
    }
    :is(.ph-scroll, .view-inner, .main-body, .modal-body)::-webkit-scrollbar-thumb:hover { background: var(--muted); }
    :is(.ph-scroll, .view-inner, .main-body, .modal-body)::-webkit-scrollbar-corner { background: transparent; }
    @supports not selector(::-webkit-scrollbar) {
      :is(.ph-scroll, .view-inner, .main-body, .modal-body) { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    }

    .kv { display: flex; justify-content: space-between; font-size: var(--fs-base); padding: 9px 0; border-bottom: 1px dashed var(--line); }
    .kv .k { color: var(--muted); }

    /* 用户管理表格 */
    .u-table { width: 100%; border-collapse: collapse; font-size: var(--fs-base); }
    .u-table th, .u-table td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
    .u-table th { color: var(--muted); font-weight: 500; font-size: var(--fs-sm); }
    .u-project-chip { display: inline-block; font-size: var(--fs-xs); padding: 1px 7px; margin: 1px 2px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); }
    .u-row { cursor: pointer; }
    .u-row:hover { background: var(--panel); }
    .small-btn { font-size: var(--fs-xs); padding: 3px 8px; border-radius: var(--r-1); border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
    .small-btn:hover { color: var(--accent); border-color: var(--accent); }
    .small-btn.danger:hover { color: var(--danger); border-color: var(--danger); }

    /* 主题选择 */
    .theme-opts { display: flex; gap: var(--sp-3); }
    .theme-opt { flex: 1; border: 2px solid var(--line); border-radius: 10px; padding: var(--sp-4); text-align: center; cursor: pointer; }
    .theme-opt.active { border-color: var(--accent); }
    .theme-swatch { height: 40px; border-radius: var(--r-2); margin-bottom: var(--sp-2); }
    .swatch-light { background: #eef1f5; border: 1px solid #d8dee6; }
    .swatch-dark { background: #232834; border: 1px solid #414a5c; }

    /* 水印叠加层（F05 插件用） */

    /* Markdown preview styles (F16 files-edit-md) */
    .md-preview h1,.md-preview h2,.md-preview h3,.md-preview h4 { margin: 14px 0 8px; line-height: 1.4; }
    .md-preview h1 { font-size: var(--fs-xl); border-bottom: 1px solid var(--line); padding-bottom: 6px; }
    .md-preview h2 { font-size: var(--fs-lg); }
    .md-preview h3 { font-size: 16px; }
    .md-preview p { margin: var(--sp-2) 0; }
    .md-preview code { background: var(--bg); padding: 1px 5px; border-radius: var(--r-1); font-family: Consolas, monospace; font-size: var(--fs-base); }
    .md-preview pre { background: #1e1e2e; color: #e4e4e7; padding: 12px 14px; border-radius: var(--r-3); overflow: auto; }
    .md-preview pre code { background: none; padding: 0; color: inherit; }
    .md-preview table { border-collapse: collapse; margin: 10px 0; }
    .md-preview th,.md-preview td { border: 1px solid var(--line); padding: 5px 10px; font-size: var(--fs-base); }
    .md-preview th { background: var(--bg); }
    .md-preview blockquote { border-left: 3px solid var(--accent); margin: var(--sp-2) 0; padding: 2px 12px; color: var(--muted); background: var(--bg); border-radius: 0 var(--r-2) var(--r-2) 0; }
    .md-preview hr { border: none; border-top: 1px solid var(--line); margin: var(--sp-3) 0; }
    .md-preview .md-wikilink { color: var(--accent); text-decoration: none; border-bottom: 1px dashed var(--accent); cursor: pointer; }
    .md-preview ul,.md-preview ol { padding-left: 22px; margin: var(--sp-2) 0; }
    .watermark-overlay {
      /* 显示 bug 修复：原 z-index:999 会被上传队列抽屉（z-index:1200，同在右下角）
         完全盖住，导致上传期间「防截屏水印」失效。水印是安全功能，必须始终在最上层。
         FE-03 P2-1：改为令牌 --z-watermark(2100)。它现在还必须高于 toast 提示条
         （原先两者同为 2000，谁在上面靠源码顺序决定 —— 同值冲突，已消除）。 */
      position: fixed; right: 12px; bottom: 10px; pointer-events: none; z-index: var(--z-watermark);
      color: rgba(90,130,200,.55); font-size: var(--fs-sm); opacity: .18;
    }

    /* 全局 toast（E1/E2：替换成功/提示类 alert） */
    #privhub-toast-host {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      z-index: var(--z-toast); display: flex; flex-direction: column; gap: var(--sp-2); align-items: center;
      pointer-events: none;
    }
    .privhub-toast {
      background: rgba(20,28,40,.93); color: #fff; padding: 9px 18px; border-radius: var(--r-3);
      font-size: var(--fs-base); box-shadow: var(--sh-4);
      animation: toast-in .2s ease; max-width: 60vw; line-height: 1.5;
    }
    .privhub-toast.success { border-left: 3px solid #4caf7d; }
    .privhub-toast.error { border-left: 3px solid #e06c6c; }
    .privhub-toast.warn { border-left: 3px solid #e0a35c; }
    .privhub-toast.out { opacity: 0; transition: opacity .3s; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(-6px) } to { opacity: 1; transform: none } }

    /* D2：按压反馈 / 键盘焦点可见 / 点击目标下限 */
    .btn:active, .icon-btn:active, .small-btn:active, .u-project-chip:active { transform: scale(.97); }
    .btn:focus-visible, .icon-btn:focus-visible, .small-btn:focus-visible,
    input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    /* FE-03 P0-3：上面两条只覆盖了按钮与表单，而【最高频的点击目标】——
     * 目录树行、项目横排、左侧图标栏、文件卡/文件行、右键菜单项——一个都没有，
     * 键盘用户 Tab 过去界面上毫无变化（不知道焦点在哪）。
     * 只扩选择器清单、不改结构；:focus-visible 的意义就是"键盘才出框、鼠标不弹框"，
     * 所以上面那些 outline:none 一个都不要删。 */
    .tree-item:focus-visible, .ptab:focus-visible, .abar-item:focus-visible,
    .file-card:focus-visible, .file-table-row:focus-visible, .ctx-item:focus-visible,
    .theme-opt:focus-visible, .auth-switch a:focus-visible, .md-wikilink:focus-visible,
    .project-item:focus-visible, .v3-tn:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 1px; border-radius: inherit;
    }
    .icon-btn, .small-btn { min-height: 32px; min-width: 32px; }

    /* ============================================================
     * 交互原型组件层（issue #3 样机）—— L0 框架 / 驾驶舱 / 项目 tab / 抽屉
     *
     * 全部走 --p-* 原型令牌，类名带 ph- 前缀避免与业务插件撞名。
     * 既有业务插件仍用 --accent/--panel 那套，互不干扰。
     * ============================================================ */

    /* ---- L0 顶栏：品牌 · 身份+角色徽标 · 全局偏好 ---- */
    .ph-top {
      height: var(--p-top-h); flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
      padding: 0 16px; background: var(--p-surface); border-bottom: 1px solid var(--p-border);
      position: relative; z-index: var(--z-raised); box-shadow: var(--p-shadow-sm);
    }
    .ph-top::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
      background: linear-gradient(90deg, var(--p-indigo), var(--p-cyan) 45%, var(--p-magenta));
      opacity: .55; pointer-events: none;
    }
    .ph-logo { display: flex; align-items: center; gap: 9px; font-weight: 700; color: var(--p-text); cursor: pointer; }
    .ph-logo .mark {
      width: 28px; height: 28px; border-radius: 8px; background: var(--p-grad);
      display: grid; place-items: center; color: #fff; font-size: 15px;
    }
    .ph-logo small { color: var(--p-muted); font-weight: 500; font-size: 12px; }
    .ph-persona {
      display: flex; align-items: center; gap: 8px; background: var(--p-surface2);
      border: 1px solid var(--p-border); border-radius: 10px; padding: 5px 10px;
    }
    .ph-persona .who { font-size: 13px; color: var(--p-text); font-weight: 600; }
    .ph-rolebadge { font-size: 11px; border-radius: 99px; padding: 2px 9px; border: 1px solid; white-space: nowrap; }
    .ph-rolebadge.admin { color: var(--p-red); border-color: var(--p-red); }
    .ph-rolebadge.user { color: var(--p-blue); border-color: var(--p-blue); }
    .ph-iconbtn {
      width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
      color: var(--p-muted); font-size: 16px; background: none; border: none; cursor: pointer;
    }
    .ph-iconbtn:hover { background: var(--p-surface2); color: var(--p-text); }
    .ph-iconbtn:focus-visible { outline: 2px solid var(--p-indigo); outline-offset: 1px; }

    /* ---- L0 框架：左 rail + 内容区 ---- */
    .ph-shell { display: flex; flex: 1; min-height: 0; overflow: hidden; }
    .ph-rail {
      width: var(--p-rail-w); flex: 0 0 var(--p-rail-w); background: var(--p-surface);
      border-right: 1px solid var(--p-border); padding: 12px 10px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 3px;
    }
    /* 展示区 / 控制区两块：中间弹性空白把控制区推到底，设置钉最底 */
    .ph-zone { display: flex; flex-direction: column; gap: 3px; }
    .ph-zone.show { flex: 0 0 auto; }
    .ph-zone.control {
      margin-top: auto; flex: 0 0 auto; padding-top: 12px; position: relative;
      border-top: 1px dashed var(--p-border);
    }
    .ph-zone.control::before {
      content: ''; position: absolute; top: -1px; left: 10px; right: 10px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--p-amber), transparent); opacity: .5;
    }
    .ph-zone-h {
      display: flex; align-items: center; gap: 6px; padding: 5px 8px 6px;
      font-size: 10px; letter-spacing: .14em; color: var(--p-faint); white-space: nowrap;
    }
    .ph-zone-h .dot { width: 5px; height: 5px; border-radius: 50%; flex: 0 0 5px; }
    .ph-zone-h .dot.cyan { background: var(--p-cyan); }
    .ph-zone-h .dot.amber { background: var(--p-amber); }
    .ph-nav .lock {
      margin-left: auto; font-size: 9.5px; color: var(--p-faint);
      border: 1px solid var(--p-border); border-radius: 4px; padding: 0 4px; line-height: 1.4;
    }
    .ph-nav.active .lock { color: rgba(255,255,255,.8); border-color: rgba(255,255,255,.4); }
    .ph-ghead { padding: 6px 8px 3px; color: var(--p-faint); font-size: 11px; letter-spacing: .08em; }
    .ph-nav {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px;
      color: var(--p-muted); font-size: 13.5px; width: 100%; text-align: left;
      background: none; border: none; cursor: pointer; position: relative;
    }
    .ph-nav .ic { width: 18px; text-align: center; }
    .ph-nav:hover { background: var(--p-surface2); color: var(--p-text); }
    .ph-nav.active {
      background: color-mix(in srgb, var(--p-indigo) 12%, transparent);
      color: var(--p-indigo); font-weight: 600;
    }
    .ph-nav.active::before {
      content: ''; position: absolute; left: 0; top: 7px; bottom: 7px; width: 3px;
      border-radius: 2px; background: linear-gradient(180deg, var(--p-indigo), var(--p-cyan));
    }
    .ph-nav.disabled { opacity: .4; cursor: not-allowed; }
    .ph-nav:focus-visible { outline: 2px solid var(--p-indigo); outline-offset: 1px; }
    .ph-railnote {
      margin: 10px 6px 0; padding: 9px 10px; border: 1px dashed var(--p-border);
      border-radius: 9px; color: var(--p-faint); font-size: 11px; line-height: 1.55;
    }
    .ph-railnote b { color: var(--p-indigo); }
    .ph-content { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }

    /* ---- T2 位置层（位置链 + 场景页签）：全站只有一条 ----

       现在 T2 一条到底：左位置链、右场景页签，统一「下划线」语言。 */
    /* 唯一一条框架横带。2026-11-16：由 46px 压到 40px —— 主人实测「横带太多、

    .ph-t2 {

    .ph-tnode .ell { overflow: hidden; text-overflow: ellipsis; }
    .ph-tarrow { color: var(--p-faint); font-size: 10px; opacity: .65; flex: 0 0 auto; padding: 0 1px; }
    .ph-t2 .grow { flex: 1; min-width: 8px; }

    /* 场景页签：T2 右端，唯一的主导航样式 */
    .ph-scenes { display: flex; align-items: stretch; gap: 1px; flex: 0 0 auto; }
    .ph-scene {
      position: relative; display: inline-flex; align-items: center; gap: 7px; padding: 0 13px;

    .ph-scene .badge {
      min-width: 15px; height: 15px; padding: 0 4px; border-radius: 99px; background: var(--p-red);

    /* ---- 文件族子入口：T2 尾端的下拉（2026-11-16：原 T3 横带改下拉，省一整行） ----

    .ph-subs { position: relative; display: flex; align-items: stretch; flex: 0 0 auto; }

    .ph-sub-item .badge {

    .ph-blocktitle .muted { font-weight: 400; font-size: 12px; color: var(--p-muted); margin-left: 8px; }
    .ph-pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
    .ph-pcard {

    .ph-pcard:hover { border-color: var(--p-indigo); transform: translateY(-2px); box-shadow: var(--p-shadow); }

    .ph-pcard .desc { color: var(--p-muted); font-size: 12px; }
    .ph-prog { height: 8px; border-radius: 99px; background: var(--p-surface2); border: 1px solid var(--p-border); margin: 10px 0 6px; overflow: hidden; }
    .ph-prog i { display: block; height: 100%; border-radius: 99px; transition: width .55s cubic-bezier(.4,0,.2,1); }
    .ph-pmeta { display: flex; gap: 12px; color: var(--p-muted); font-size: 12px; align-items: center; flex-wrap: wrap; }
    .ph-nodechip { font-size: 11px; border: 1px solid var(--p-border); border-radius: 99px; padding: 2px 9px; color: var(--p-indigo); background: color-mix(in srgb, var(--p-indigo) 8%, transparent); }
    .ph-blockbadge { font-size: 11px; border-radius: 99px; padding: 2px 9px; color: var(--p-red); background: color-mix(in srgb, var(--p-red) 10%, transparent); border: 1px solid color-mix(in srgb, var(--p-red) 40%, transparent); }
    .ph-health { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 9px; }

    /* ---- KPI 行 ---- */
    .ph-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 14px; }
    .ph-kpi {
      background: var(--p-surface); border: 1px solid var(--p-border); border-radius: 12px;

    .ph-kpi .v { font-size: 26px; font-weight: 800; letter-spacing: -.02em; color: var(--p-text); }
    .ph-kpi .l { color: var(--p-muted); font-size: 12px; margin-top: 3px; }

    .ph-kpi.bad .v { color: var(--p-red); }
    .ph-kpi.warn .v { color: var(--p-amber); }
    .ph-kpi.ok .v { color: var(--p-green); }

    .ph-pipeline { background: var(--p-surface); border: 1px solid var(--p-border); border-radius: 12px; padding: 14px 16px; box-shadow: var(--p-shadow-sm); margin-bottom: 14px; }

    .ph-pipebar span { display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; min-width: 0; transition: flex-grow .5s cubic-bezier(.4,0,.2,1); }
    .ph-pipelegend { display: flex; gap: 16px; margin-top: 10px; flex-wrap: wrap; font-size: 12px; color: var(--p-muted); align-items: center; }
    .ph-pipelegend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
    .ph-pipelegend .total { margin-left: auto; font-weight: 600; }

    /* ---- 项目层固定 tab（原型渐变实底）---- */
    .ph-tabs { display: flex; gap: 6px; margin: 6px 0 14px; flex-wrap: wrap; }
    .ph-tab {
      padding: 7px 14px; border-radius: 9px; border: 1px solid var(--p-border);

    .ph-tab .badge { min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: var(--p-red); color: #fff; font-size: 10px; line-height: 16px; text-align: center; }
    .ph-tab.on .badge { background: rgba(255,255,255,.28); }

    .ph-tbtn {
      display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 9px;
      border: 1px solid var(--p-border); background: var(--p-surface); font-size: 13px;
      color: var(--p-text); cursor: pointer; transition: .15s;

    .ph-tbtn:hover { border-color: var(--p-indigo); color: var(--p-indigo); }
    .ph-tbtn.primary { background: var(--p-grad-btn); border-color: transparent; color: #fff; box-shadow: 0 4px 12px color-mix(in srgb, var(--p-indigo) 25%, transparent); }
    .ph-tbtn.primary:hover { filter: brightness(1.08); color: #fff; }
    .ph-tbtn[disabled] { opacity: .45; cursor: not-allowed; }
    .ph-tbtn:focus-visible { outline: 2px solid var(--p-indigo); outline-offset: 1px; }
    .ph-chipf { border: 1px solid var(--p-border); background: var(--p-surface); color: var(--p-muted); border-radius: 99px; padding: 4px 12px; font-size: 12px; cursor: pointer; }
    .ph-chipf.on { background: color-mix(in srgb, var(--p-indigo) 12%, transparent); border-color: var(--p-indigo); color: var(--p-indigo); }
    .ph-chipf:focus-visible { outline: 2px solid var(--p-indigo); outline-offset: 1px; }
    .ph-searchbox { display: flex; align-items: center; gap: 8px; border: 1px solid var(--p-border); background: var(--p-surface); border-radius: 9px; padding: 6px 10px; }
    .ph-searchbox input { border: none; outline: none; background: none; flex: 1; font-size: 13px; color: var(--p-text); }

    /* ---- 右侧抽屉（L3 详情操作层）---- */
    .ph-drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 94vw);
      background: var(--p-surface); border-left: 1px solid var(--p-border);
      box-shadow: var(--p-shadow); z-index: var(--z-modal); transform: translateX(100%);
      transition: transform .25s; display: flex; flex-direction: column;
    }
    .ph-drawer.open { transform: none; }
    .ph-drawer .dhead { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--p-border); color: var(--p-text); }
    .ph-drawer .dbody { flex: 1; overflow: auto; padding: 16px; }
    .ph-drawer-mask { position: fixed; inset: 0; background: rgba(0,0,0,.28); z-index: var(--z-scrim); }

    /* ---- 空态 / 日程行 / 卡点行 ---- */
    .ph-empty { color: var(--p-muted); text-align: center; padding: 30px 0; font-size: 13px; line-height: 1.8; }
    .ph-evrow { display: flex; gap: 12px; align-items: flex-start; background: var(--p-surface); border: 1px solid var(--p-border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
    .ph-evdate { flex: 0 0 52px; text-align: center; border-radius: 8px; background: color-mix(in srgb, var(--p-indigo) 10%, transparent); color: var(--p-indigo); padding: 6px 0; font-weight: 700; }
    .ph-evdate small { display: block; font-size: 10px; font-weight: 500; }
    .ph-blockitem { display: flex; align-items: center; gap: 10px; background: var(--p-surface); border: 1px solid color-mix(in srgb, var(--p-red) 35%, transparent); border-left: 4px solid var(--p-red); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }

    /* ---- 入场动画：只有导航态变化才触发（数据态不重放）---- */
    .ph-anim .ph-kpi { animation: ph-rise .4s backwards; }
    .ph-anim .ph-kpi:nth-child(2) { animation-delay: .05s; }
    .ph-anim .ph-kpi:nth-child(3) { animation-delay: .1s; }
    .ph-anim .ph-kpi:nth-child(4) { animation-delay: .15s; }
    .ph-anim .ph-pipeline { animation: ph-rise .4s .08s backwards; }
    .ph-anim .ph-pgrid .ph-pcard { animation: ph-rise .42s backwards; }
    .ph-anim .ph-pgrid .ph-pcard:nth-child(2) { animation-delay: .07s; }
    .ph-anim .ph-pgrid .ph-pcard:nth-child(3) { animation-delay: .14s; }
    .ph-anim .ph-pgrid .ph-pcard:nth-child(4) { animation-delay: .21s; }
    @keyframes ph-rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .ph-anim * { animation: none !important; } }

    /* 窄屏：rail 收成图标条 */
    @media (max-width: 860px) {
      .ph-rail { width: 60px; flex-basis: 60px; padding: 10px 6px; }
      .ph-nav .lbl, .ph-ghead, .ph-railnote, .ph-zone-h, .ph-nav .lock { display: none; }
      .ph-nav { justify-content: center; padding: 10px 0; }
    }
