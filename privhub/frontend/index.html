<body>
  <div id="app"></div>

  <script>
    const { createApp, reactive, computed, watch } = Vue

    /* ============================================================
     * 全局状态与插件桥（所有插件 client 通过 window.PrivHub 通信）
     * ============================================================ */
    const AUTH = reactive({
      token: localStorage.getItem('privhub_token') || '',
      user: null,
    })
    const THEME = reactive({ theme: localStorage.getItem('privhub_theme') || 'light' })

    /* ============================================================
     * 蓝绿热更新：版本握手与「旧页面阻断」
     *
     * 事实链：
     *   - nginx 在 /index.html 响应上原子写入 privhub_client_version Cookie
     *     （值 = 提供这份 HTML 的 release 版本）；
     *   - 控制层在 /privhub/_version 暴露当前活跃版本，并通过 SSE 广播切换；
     *   - nginx 对「携带旧版本 Cookie 的非 GET 请求」直接 409。
     *
     * 前端职责：
     *   - 启动时比较「本页版本（Cookie）」与「当前版本」，不一致立即阻断；
     *   - 订阅 SSE，切换一完成就弹阻断层，让用户刷新（而不是等用户自己发现）；
     *   - api() 在阻断态下直接拒绝本地写请求；全局 fetch 捕获 409 兜底
     *     （插件里大量上传/下载走原生 fetch，不经过 api()）。
     * ============================================================ */
    const VERSION = reactive({
      current: '',      // 本页面 HTML 所属的 release 版本（由 nginx Cookie 写入）
      server: '',       // 控制层当前活跃版本
      stale: false,     // 本页面是否已过期（阻断层可见）
      managed: false,   // true = 经 nginx + 常驻控制层（蓝绿部署）
      checked: false,
      switchedAt: null,
    })

    function versionsDiffer(a, b) {
      return typeof a === 'string' && typeof b === 'string' && a !== '' && b !== '' && a !== b
    }

    function markVersionStale(cause) {
      if (VERSION.stale) return
      VERSION.stale = true
      console.warn('[version] 当前页面已过期，需刷新：' + (cause || ''))
    }

    function readVersionCookie() {
      try {
        const m = document.cookie.match(/(?:^|;\s*)privhub_client_version=([^;]*)/)
        return m ? decodeURIComponent(m[1]) : ''
      } catch { return '' }
    }

    function setVersionCookie(v) {
      if (!v) return
      try { document.cookie = 'privhub_client_version=' + encodeURIComponent(v) + '; Path=/; SameSite=Lax' } catch { /* Cookie 被禁用 */ }
    }

    async function fetchVersionInfo() {
      /* 2 秒上限：控制层/nginx 异常时不能把首屏一起拖死。 */
      const ctrl = typeof AbortController === 'function' ? new AbortController() : null
      const timer = setTimeout(() => { if (ctrl) ctrl.abort() }, 2000)
      try {
        const r = await fetch('/privhub/_version', {
          method: 'GET',
          cache: 'no-store',
          headers: { accept: 'application/json' },
          ...(ctrl ? { signal: ctrl.signal } : {}),
        })
        if (!r.ok) return null
        const j = await r.json()
        if (!j || typeof j.version !== 'string' || j.version === '') return null
        return j
      } catch { return null } finally { clearTimeout(timer) }
    }

    async function initVersionWatch() {
      const info = await fetchVersionInfo()
      if (!info) {
        /* 直连 Node 的旧式启动或控制层暂不可用：不启用版本门，保持原有行为。 */
        console.warn('[version] 版本服务不可用，跳过版本握手')
        return
      }
      VERSION.managed = info.managed !== false
      VERSION.server = info.version
      VERSION.switchedAt = info.switchedAt || null
      /* 版本 Cookie 只对**托管部署**（nginx + 控制层）有意义。
       *
       * 2026-11-16 实测事故：在 3180（直连 Node，managed:false）上刷新，
       * 一直弹「系统已更新，当前页面属于旧版本（3.6.0）」且点刷新无用 ——
       * 原因是浏览器里还留着**生产 3181（nginx）**写下的
       * `privhub_client_version=3.6.0`，而 3180 的 /_version 报 3.6.2，
       * 两者不等就判过期。可 3180 根本不用 Cookie 做门禁（nginx 才做），
       * 这个比较在开发环境下纯属误伤，而且自己永远修不好（3180 不会写 Cookie）。
       *
       * 所以：未托管时**完全不读版本 Cookie**，页面版本直接取服务端值；
       * 托管时保持原行为（Cookie 才是「这份 HTML 是哪个 release 发的」的证据）。
       * 顺手把可能残留的旧 Cookie 清掉，避免它继续影响以后切回托管环境。 */
      if (!VERSION.managed) {
        const stale = readVersionCookie()
        if (stale) {
          try { document.cookie = 'privhub_client_version=; Max-Age=0; path=/' } catch { /* 忽略 */ }
          console.info('[version] 未托管部署，已忽略并清除残留版本 Cookie（' + stale + '）')
        }
        VERSION.current = info.version
        VERSION.checked = true
        return
      }
      const cookieVer = readVersionCookie()
      /* 本页版本优先取 Cookie（它跟随 HTML 响应写入）；缺失时退回当前版本，
       * 并补写 Cookie 让 nginx 的写入门有依据。 */
      VERSION.current = cookieVer || info.version
      if (!cookieVer) setVersionCookie(info.version)
      VERSION.checked = true
      if (versionsDiffer(VERSION.current, VERSION.server)) {
        markVersionStale('页面版本 ' + VERSION.current + ' ≠ 当前版本 ' + VERSION.server)
        return
      }
      if (!VERSION.managed) return
      try {
        const es = new EventSource('/privhub/_version/stream')
        const onVersion = (ev) => {
          try {
            const msg = JSON.parse(ev.data || '{}')
            if (typeof msg.version !== 'string' || msg.version === '') return
            VERSION.server = msg.version
            VERSION.switchedAt = msg.switchedAt || null
            if (versionsDiffer(VERSION.current, msg.version)) {
              markVersionStale('系统已更新到 ' + msg.version)
            }
          } catch { /* 坏帧忽略 */ }
        }
        es.addEventListener('hello', onVersion)
        es.addEventListener('version', onVersion)
        /* onerror：浏览器会自动重连；断线期间不做误判（控制层重启不代表版本变化）。 */
      } catch (e) {
        console.warn('[version] 版本事件流不可用:', e)
      }
    }

    /* 原生 fetch 兜底：上传/下载等插件路径不经过 api()，但同样会被版本门 409。
     * 只观察、不改写响应（clone 后解析 JSON，不消费原响应体）。 */
    const nativeFetch = window.fetch.bind(window)
    window.fetch = async function patchedFetch(input, init) {
      const res = await nativeFetch(input, init)
      try {
        if (res.status === 409) {
          res.clone().json().then((j) => {
            if (j && j.code === 'PRIVHUB_CLIENT_STALE') markVersionStale(j.error || '服务端拒绝了旧页面请求')
          }).catch(() => { /* 非 JSON 的 409 与版本无关 */ })
        }
      } catch { /* clone 失败不影响业务响应 */ }
      return res
    }

    function applyTheme() {
      document.documentElement.setAttribute('data-theme', THEME.theme)
      localStorage.setItem('privhub_theme', THEME.theme)
    }

    async function api(path, opts = {}) {
      /* 旧页面写入手闸：切换后旧前端不可再发写请求（读请求仍放行，
       * 让用户能继续浏览直到刷新）。登录/注册必须豁免——否则旧页面无法
       * 重新登录会形成死锁；Agent 网关不带版本 Cookie，由 nginx 豁免。 */
      const method = String(opts.method || 'GET').toUpperCase()
      if (VERSION.stale && method !== 'GET' && method !== 'HEAD') {
        const exempt = path.includes('/privhub/api/login')
          || path.includes('/privhub/api/register')
          || path.includes('/privhub/api/agent/')
        if (!exempt) {
          return { ok: false, code: 'PRIVHUB_CLIENT_STALE', error: '系统已更新，请刷新页面后重试' }
        }
      }
      const headers = { 'content-type': 'application/json', ...(opts.headers || {}) }
      if (AUTH.token) headers['authorization'] = 'Bearer ' + AUTH.token
      let res
      try {
        res = await fetch(path, { ...opts, headers })
      } catch (e) {
        // A6：网络错误归一，避免调用点静默假空
        return { ok: false, error: '网络错误：' + (e && e.message ? e.message : '无法连接服务器') }
      }
      // E6：401 统一处理（登录/注册除外，其 401 为表单预期反馈）
      if (res.status === 401 && !path.includes('/privhub/api/login') && !path.includes('/privhub/api/register')) {
        logout()
        toast('登录已过期，请重新登录', 'warn')
      }
      try {
        const data = await res.json()
        if (res.status === 409 && data && data.code === 'PRIVHUB_CLIENT_STALE') {
          markVersionStale(data.error || '当前页面版本已被切换')
        }
        return data
      } catch {
        // 非 JSON 响应（网关/静态兜底）归一
        return { ok: false, error: '服务器返回异常（HTTP ' + res.status + '）' }
      }
    }

    /* E1/E2：全局 toast 反馈（替换成功/提示类 alert；window.PrivHub.toast 供插件调用） */
    function toast(msg, type = 'success') {
      let host = document.getElementById('privhub-toast-host')
      if (!host) {
        host = document.createElement('div')
        host.id = 'privhub-toast-host'
        document.body.appendChild(host)
      }
      const el = document.createElement('div')
      el.className = 'privhub-toast ' + type
      el.textContent = msg
      host.appendChild(el)
      setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320) }, 2600)
    }
    function logout() {
      AUTH.token = ''; AUTH.user = null
      localStorage.removeItem('privhub_token')
    }

    /* 事件总线：跨插件解耦通信（file:* / trash:* / auth:* 等） */
    const bus = {
      _l: {},
      on(ev, fn) {
        (this._l[ev] = this._l[ev] || []).push(fn)
        return () => this.off(ev, fn)
      },
      off(ev, fn) {
        const a = this._l[ev]
        if (a) { const i = a.indexOf(fn); if (i >= 0) a.splice(i, 1) }
      },
      emit(ev, ...args) {
        ;(this._l[ev] || []).slice().forEach(fn => { try { fn(...args) } catch (e) { console.error('[bus]', ev, e) } })
      },
    }

    /* ============================================================
     * 导航状态机（骨架持有；插件组件通过 window.PrivHub.nav 读写）
     * ============================================================ */
    /* 选项目后落到哪个视图：按优先级挑第一个「真装得上」的。
     * 想改落地页（例如改成任务看板），只动这一行的顺序即可；留空 [] = 回到旧行为（进文件）。 */
    const PROJECT_LANDING = ['files', 'dashboard', 'taskboard']   // 文件 → 项目看板 → 任务看板（2026-11-13：进项目先看见文件）
    const nav = reactive({
      project: null,          // 当前项目名（null = 欢迎页）
      path: '',               // 项目内相对路径
      entries: [],            // 当前目录条目
      listLoading: false,
      selected: null,
      preview: null,          // { type, data, name }
      rightOpen: false,
      trashView: false,
      trashList: [],
      searchView: false,
      favView: false,
      /* ⑤ 视图化（llm_wiki 范式）：单一 activeView 状态源，天然互斥无残留
         'files'(默认) | 'trash' | 'search' | 'favorites' | settings | admin | acl | audit | tags | template | kg | wiki | rag | agent | taskboard | calendar | dashboard | refcheck | home | me
         trashView/searchView/favView 为兼容镜像（视图型测试仍可读） */
      activeView: 'files',
      /* 使用说明弹层（{ title, html, text, loading } | null）。图标栏悬停气泡的
         「查看完整说明」调 nav.openHelp(文件名)，读 /privhub/api/help 渲染在模态里。 */
      helpDoc: null,
      /* P2-3：骨架级内联输入模态（{ title, value, onOk } | null） */
      inputState: null,
      /* 2026-11-14（主人第 13 轮意见）：文件区默认改**列表**。
         卡片一格占 ~110px 高、一屏只放得下 8~10 个，且只显示「名字 + 一行小字」；
         列表一行 ~33px，同屏 20+ 条，并把大小/类型/时间拉到同一行对齐可比。
         卡片仍保留（▦ 可切回），偏好按本机持久化，只影响自己。 */
      viewMode: localStorage.getItem('privhub_view_mode') === 'grid' ? 'grid' : 'list',
      sortKey: 'name',
      sortAsc: true,
      /* 文件区「只看文件夹」筛选（2026-11-13 重排：文件夹与文件同列中间区，
         此开关让用户在目录导航与文件浏览之间快速切换）。持久化在本机。 */
      dirOnly: localStorage.getItem('privhub_dir_only') === '1',
      checked: {},            // 批量多选：name -> true
      uploading: false,
      uploadDone: 0,
      uploadTotal: 0,
      tree: reactive({}),     // 目录树展开缓存：key -> { expanded, children }
      /* A2：左面板宽度（拖拽调整 + localStorage 持久化；0 = 折叠） */
      sidebarWidth: parseInt(localStorage.getItem('privhub_sidebar_w') || '220', 10) || 220,
      /* 导航形态：新层级导航（层级条 + 项目四 tab）为默认；
       * compactRail=true 时切回旧的紧凑图标竖栏。两套读同一份 barItems 与归组数据，
       * 所以切换不会丢功能 —— 保留它是为了「用惯了竖栏的人不必被迫改习惯」。 */
      compactRail: localStorage.getItem('privhub_compact_rail') === '1',
      setCompactRail(on) {
        nav.compactRail = !!on
        localStorage.setItem('privhub_compact_rail', on ? '1' : '0')
      },
      toggleSidebar() {
        nav.sidebarWidth = nav.sidebarWidth > 40 ? 0 : 220
        localStorage.setItem('privhub_sidebar_w', String(nav.sidebarWidth))
      },
      /* ⑤ 视图切换（toggle）：点同一视图图标 = 回到文件视图；视图间互斥由单一状态保证
       * noToggle：管理控制台外壳专用。管理侧栏切换管理页时绝不能因为「点的是当前视图」
       *           而 toggle 回文件页（需求：管理视图内不触发回 files 的 toggle 行为）。 */
      setActiveView(v, opts) {
        const noToggle = !!(opts && opts.noToggle)
        if (!noToggle && nav.activeView === v) v = 'files'
        nav.activeView = v
        // 兼容镜像：视图型标志与 activeView 同步（回收站/搜索/收藏视图入口）
        nav.trashView = v === 'trash'
        nav.searchView = v === 'search'
        nav.favView = v === 'favorites'
        // 视图切换即归零：功能视图下无需右侧预览/选中态
        nav.rightOpen = false; nav.selected = null; nav.preview = null
      },

      /* ---- 导航 ---- */
      async loadProjects() {
        const r = await api('/privhub/api/projects')
        if (r.ok) nav.projectsList = r.projects
      },
      async openDir(project, path) {
        nav.trashView = false
        nav.searchView = false
        nav.favView = false
        nav.activeView = 'files'   // ⑤ 进目录即回到文件视图
        nav.project = project
        nav.path = path || ''
        nav.selected = null; nav.preview = null; nav.rightOpen = false
        nav.listLoading = true
        const q = path ? '&path=' + encodeURIComponent(path) : ''
        const r = await api('/privhub/api/list?project=' + encodeURIComponent(project) + q)
        nav.listLoading = false
        nav.entries = r.ok ? r.entries : []
        // A6：接口失败不再静默假空
        if (!r.ok && r.error) toast(r.error, 'error')
        bus.emit('file:opened', { project, path: nav.path })
      },
      /* 选项目 = 进入这个项目：默认落到「文件」（见 PROJECT_LANDING，2026-11-13 用户要求进项目先看见文件）。
       * opts.view 显式指定落地视图——看板/日历内部切项目原地同步时用。 */
      async openProject(name, opts) {
        await nav.openDir(name, '')
        const key = nav.treeKey(name, '')
        if (!nav.tree[key]) await nav.toggleTree(name, '')
        const want = (opts && opts.view) || nav.projectLandingView()
        if (want && want !== 'files') nav.setActiveView(want, { noToggle: true })
      },
      /* 落地视图：按 PROJECT_LANDING 优先级挑第一个真装得上的；都没有则回文件视图 */
      projectLandingView() {
        for (const v of PROJECT_LANDING) if (nav.hasBarView(v)) return v
        return 'files'
      },
      /* 该视图是否真装得上（barItems 已按 cap / 管理员过滤，比原始 manifest 更准） */
      hasBarView(view) {
        const items = (window.PrivHub && window.PrivHub.barItems) || []
        return items.some((b) => (b.view || b.slot) === view)
      },
      async backToWelcome() {
        nav.trashView = false
        nav.searchView = false
        nav.favView = false
        nav.activeView = 'files'
        nav.project = null; nav.path = ''
        nav.entries = []; nav.selected = null; nav.preview = null; nav.rightOpen = false
      },
      async gotoCrumb(path) { await nav.openDir(nav.project, path) },

      /* ---- 目录树 ---- */
      treeKey(project, path) { return project + '/' + (path || '') },
      async toggleTree(project, path) {
        const key = nav.treeKey(project, path)
        if (!nav.tree[key]) {
          nav.tree[key] = { expanded: true, children: [] }
          const q = path ? '&path=' + encodeURIComponent(path) : ''
          const r = await api('/privhub/api/list?project=' + encodeURIComponent(project) + q)
          if (r.ok) {
            nav.tree[key].children = r.entries.filter(e => e.isDir).map(e => ({ name: e.name, path: path ? path + '/' + e.name : e.name }))
          }
        } else {
          nav.tree[key].expanded = !nav.tree[key].expanded
        }
      },
      isExpanded(project, path) {
        const key = nav.treeKey(project, path)
        return nav.tree[key] && nav.tree[key].expanded
      },
      childrenOf(project, path) {
        const key = nav.treeKey(project, path)
        return (nav.tree[key] && nav.tree[key].children) || []
      },
      refreshTree() {
        // 当前目录与上级的树缓存失效，下次展开重新拉取
        const key = nav.treeKey(nav.project, nav.path)
        if (nav.tree[key]) nav.tree[key].children = []
        const parentPath = nav.path.includes('/') ? nav.path.slice(0, nav.path.lastIndexOf('/')) : ''
        const pkey = nav.treeKey(nav.project, parentPath)
        if (nav.tree[pkey]) nav.tree[pkey].children = []
      },
      async delProject(name) {
        if (!confirm('将项目「' + name + '」及其所有文件移入回收站？')) return
        const r = await api('/privhub/api/project-delete', { method: 'POST', body: JSON.stringify({ name }) })
        if (r.ok) { await nav.loadProjects(); if (nav.project === name) await nav.backToWelcome(); toast('项目「' + name + '」已移入回收站') }
        else toast(r.error || '删除失败', 'error')
      },

      /* ---- 排序 / 视图 ---- */
      relPathOf(name) { return nav.path ? nav.path + '/' + name : name },
      toggleSort(key) {
        if (nav.sortKey === key) nav.sortAsc = !nav.sortAsc
        else { nav.sortKey = key; nav.sortAsc = true }
      },
      /* 切视图时记住偏好（只影响自己）：下次进来还是上次那个形态。 */
      setViewMode(m) {
        nav.viewMode = m
        try { localStorage.setItem('privhub_view_mode', m) } catch { /* 隐私模式忽略 */ }
      },

      /* ---- 使用说明（帮助弹层）----
       * 读站内《使用说明》文档（服务端 /privhub/api/help，登录即可读，见 privhub-shell）。
       * 图标栏悬停气泡的「查看完整说明」走这里。文档在站内 privhub 项目的 使用说明/ 下。 */
      async openHelp(docName) {
        const name = String(docName || '00-总览.md')
        nav.helpDoc = { title: name.replace(/\.md$/i, ''), html: '', text: '', loading: true }
        const r = await api('/privhub/api/help?doc=' + encodeURIComponent(name))
        if (!r.ok) {
          nav.helpDoc = null
          toast(r.error || '说明文档读取失败', 'error')
          return
        }
        nav.helpDoc = { title: r.title || name.replace(/\.md$/i, ''), html: mdToHtml(r.text || ''), text: r.text || '', loading: false }
      },
      closeHelp() { nav.helpDoc = null },

      /* ---- 选中 / 预览 ---- */
      async selectEntry(e) {
        nav.selected = e
        if (e.isDir) {
          nav.preview = null
          nav.rightOpen = false
          return
        }
        const rel = nav.relPathOf(e.name)
        const r = await api('/privhub/api/preview?project=' + encodeURIComponent(nav.project) + '&path=' + encodeURIComponent(rel))
        nav.preview = r.ok ? { type: r.type, data: r.data, name: e.name } : { type: 'unknown', data: '', name: e.name }
        nav.rightOpen = true
      },
      async openEntry(e) {
        if (e.isDir) {
          const rel = nav.relPathOf(e.name)
          await nav.openDir(nav.project, rel)
        } else {
          // F16：广播文件打开事件（md 编辑器等插件监听；现有预览行为不变）
          bus.emit('entry:open', { entry: e, project: nav.project, path: nav.path })
          await nav.selectEntry(e)
        }
      },

      /* ---- 文件操作 ---- */
      /* P2-3：输入类 prompt → 骨架级内联输入模态（nav.askInput 由 App 渲染，onOk 回执行） */
      askInput(title, initial, onOk) {
        nav.inputState = { title, value: initial || '', onOk }
      },
      async submitMkdir() {
        const navSelf = nav
        nav.askInput('请输入文件夹名称：', '', async (name) => {
          if (!name) return
          const r = await api('/privhub/api/mkdir', { method: 'POST', body: JSON.stringify({ project: navSelf.project, path: navSelf.path, name }) })
          if (r.ok) { await navSelf.openDir(navSelf.project, navSelf.path); navSelf.refreshTree(); toast('文件夹「' + name + '」已创建') }
          else toast(r.error || '新建失败', 'error')
        })
      },
      async doRename(entry) {
        const navSelf = nav
        const rel = navSelf.relPathOf(entry.name)
        nav.askInput('请输入新名称：', entry.name, async (newName) => {
          if (!newName || newName === entry.name) return
          const r = await api('/privhub/api/rename', { method: 'POST', body: JSON.stringify({ project: navSelf.project, path: rel, newName }) })
          if (r.ok) { await navSelf.openDir(navSelf.project, navSelf.path); toast('已重命名为「' + newName + '」') }
          else toast(r.error || '重命名失败', 'error')
        })
      },
      async doDelete(entry) {
        if (!confirm('将「' + entry.name + '」移入回收站？')) return
        const rel = nav.relPathOf(entry.name)
        const r = await api('/privhub/api/delete', { method: 'POST', body: JSON.stringify({ project: nav.project, path: rel }) })
        if (r.ok) {
          await nav.openDir(nav.project, nav.path)
          bus.emit('file:trash', { id: entry.name })
          toast('「' + entry.name + '」已移入回收站')
        }
        else toast(r.error || '删除失败', 'error')
      },
      addFile() { bus.emit('upload:request') },

      /* ---- 回收站 ---- */
      fmtTime(ts) {
        const d = new Date(ts)
        const p = n => String(n).padStart(2, '0')
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes())
      },
      async openTrash() {
        nav.setActiveView('trash')
        // 项目上下文保留（不清空 project）：回收站按当前项目过滤
        nav.entries = []
        await nav.loadTrash()
      },
      async openSearch() {
        nav.setActiveView('search')
        // 项目上下文保留：搜索限定当前项目
        nav.entries = []
      },
      async openFavorites() {
        nav.setActiveView('favorites')
        // 项目上下文保留：收藏按当前项目过滤
        nav.entries = []
      },
      async loadTrash() {
        const r = await api('/privhub/api/trash-list')
        if (r.ok) {
          nav.trashList = r.trash
          // 角标需在列表刷新后同步（回收站视图未挂载时也要更新，例如登录后首次加载）
          if (window.PrivHub.badges) {
            const cur = nav.project
            window.PrivHub.badges.trash = cur
              ? r.trash.filter((t) => t.project === cur || t.relPath === '').length
              : r.trash.length
          }
        }
      },
      async restoreTrash(t) {
        const r = await api('/privhub/api/trash-restore', { method: 'POST', body: JSON.stringify({ id: t.id }) })
        if (!r.ok) { toast(r.error || '恢复失败', 'error'); return }
        nav.tree = reactive({})
        if (t.relPath === '') await nav.loadProjects()
        const parent = t.relPath.includes('/') ? t.relPath.slice(0, t.relPath.lastIndexOf('/')) : ''
        if (t.project === nav.project && parent === nav.path) await nav.openDir(nav.project, nav.path)
        await nav.loadTrash()
        bus.emit('trash:changed', { id: t.id })
        bus.emit('file:restored', { id: t.id, project: t.project, path: t.relPath, name: t.name })
      },
      async purgeTrash(t) {
        if (!confirm('彻底删除「' + t.name + '」？此操作不可恢复！')) return
        const r = await api('/privhub/api/trash-purge', { method: 'POST', body: JSON.stringify({ id: t.id }) })
        if (!r.ok) { toast(r.error || '删除失败', 'error'); return }
        await nav.loadTrash()
        bus.emit('trash:changed', { id: t.id })
      },
      async cleanExpiredTrash() {
        if (!confirm('清理在回收站中超过 30 天的条目（物理删除，不可恢复）？')) return
        const r = await api('/privhub/api/trash-clean', { method: 'POST', body: '{}' })
        if (r.ok) { toast('已清理 ' + (r.purged || 0) + ' 条'); await nav.loadTrash() }
        else toast(r.error || '清理失败', 'error')
      },

      /* ---- 管理员 ---- */
      async newProject() {
        const navSelf = nav
        nav.askInput('新项目名称：', '', async (name) => {
          if (!name) return
          const r = await api('/privhub/api/project-create', { method: 'POST', body: JSON.stringify({ name }) })
          if (r.ok) await navSelf.loadProjects()
          else toast(r.error || '新建失败', 'error')
        })
      },
      async doLogout() {
        try { await api('/privhub/api/logout') } catch {}
        logout()
      },
    })
    nav.projectsList = []

    /* 排序后的条目（计算属性：文件夹在前） */
    function sortedEntries() {
      const arr = [...nav.entries]
      const key = nav.sortKey
      const asc = nav.sortAsc ? 1 : -1
      arr.sort((a, b) => {
        if (a.isDir !== b.isDir) return a.isDir ? -1 : 1
        let va, vb
        if (key === 'name') { va = a.name; vb = b.name }
        else if (key === 'size') { va = a.isDir ? -1 : a.size; vb = b.isDir ? -1 : b.size }
        else if (key === 'mtime') { va = a.mtime; vb = b.mtime }
        else { va = a.name; vb = b.name }
        if (va < vb) return -1 * asc
        if (va > vb) return 1 * asc
        return 0
      })
      return arr
    }

    /* 文件图标辅助 */
    function fileIcon(type, isDir) {
      if (isDir) return '📁'
      const t = (type || '').toLowerCase()
      const map = {
        'png': '🖼', 'jpg': '🖼', 'jpeg': '🖼', 'gif': '🖼', 'webp': '🖼', 'svg': '🖼', 'bmp': '🖼',
        'pdf': '📕', 'doc': '📘', 'docx': '📘', 'xls': '📗', 'xlsx': '📗', 'ppt': '📙', 'pptx': '📙',
        'txt': '📄', 'md': '📄', 'zip': '🗜', 'rar': '🗜', 'mp3': '🎵', 'mp4': '🎬', 'json': '📄',
        /* 音视频（2026-10-09）：把 `file-exts.ts` 的 AUDIO_EXTS / VIDEO_EXTS 补全图标 ——
         * 迁前只认 mp3/mp4，其余媒体（wav/flac/mkv/avi/mov…）显示成通用文档图标，
         * 与"它其实是媒体"这件事不符。取值与那两个集合逐项同值（多了/少了都只是图标问题，不影响预览）。 */
        'wav': '🎵', 'ogg': '🎵', 'oga': '🎵', 'opus': '🎵', 'aac': '🎵', 'm4a': '🎵', 'flac': '🎵',
        'm4v': '🎬', 'webm': '🎬', 'ogv': '🎬', 'mov': '🎬', 'qt': '🎬', '3gp': '🎬', '3g2': '🎬', 'avi': '🎬', 'mkv': '🎬',
      }
      return map[t] || '📄'
    }
    /* ---------- 文件内容 URL（前端**第二处**同名口径，见下） ----------
     * 骨架不能 import 插件模块（no-build + 插件 client 只许引用同目录文件），
     * 所以这里有一份与 `plugins/privhub-files-explorer-v3/client/utils.js` 的
     * `fileContentUrl` / `contentUrlFor` **逐字同口径**的镜像。改口径时两处一起改。
     *
     * 读路径两条：
     *   ① `/f/<fileId>.<ext>` —— nginx 按主索引给的不透明 ID 直读（新）；
     *   ② `/privhub/api/preview-raw?project=&path=` —— **必须保留**的老路。
     *      条目没有 id（老数据 / 索引未就绪 / 索引服务没挂）时走它，否则存量文件会打不开。
     * 选择只有 `fileContentUrl` 一处做（拿不到合法 ID 就回空串 ⇒ 调用方自动走老路）。
     *
     * ⚠ 必须带扩展名：nginx 在 `X-Accel-Redirect` 后**按 URL 扩展名重算 Content-Type，
     *   忽略上游给的那个**。裸 `/f/<id>` 会退化成 application/octet-stream ——
     *   图片不显示、视频不播放（且只在使用明文提速时出现，默认降级路径测不出来）。
     */
    const FILE_ID_RE = /^[A-Za-z0-9_-]+$/
    /* 取扩展名（小写、不含点），与后端 fileindex/core.ts 的 extOf 同口径。 */
    function extOfName(name) {
      const n = typeof name === 'string' ? name : ''
      const i = n.lastIndexOf('.')
      if (i <= 0 || i === n.length - 1) return ''
      return n.slice(i + 1).toLowerCase()
    }
    function fileContentUrl(fileId, name) {
      const id = typeof fileId === 'string' ? fileId.trim() : ''
      if (id === '' || !FILE_ID_RE.test(id)) return ''
      const ext = extOfName(name)
      return '/f/' + id + (ext ? '.' + ext : '')
    }
    /* 当前目录里按文件名查主索引 ID。查不到就回空串 —— 那不是错误，
     * 只是这个条目该走老路（例如索引还在首次扫描中）。 */
    function idOfEntry(name) {
      const list = (nav && nav.entries) || []
      for (const e of list) {
        if (e && e.name === name && typeof e.id === 'string') return e.id
      }
      /* 兜底：当前目录列表里没有（例如右侧预览显示的是别处的选中项）就看选中项。 */
      const s = nav && nav.selected
      if (s && s.name === name && typeof s.id === 'string') return s.id
      return ''
    }
    function previewImageUrl(name) {
      const rel = nav.path ? nav.path + '/' + name : name
      const direct = fileContentUrl(idOfEntry(name), name)
      if (direct) return direct
      return '/privhub/api/preview-raw?project=' + encodeURIComponent(nav.project) + '&path=' + encodeURIComponent(rel)
    }
    function previewPdfUrl(name) {
      return previewImageUrl(name)
    }

    /* ---------- 极小 Markdown 渲染（骨架自足，专供《使用说明》弹层） ----------
     * 解耦复制 wiki 插件那份同语义实现（no build 下骨架不能 import 插件模块）。
     * 先整体转义 HTML，再逐行做块级解析：围栏代码 / 标题 / 分隔线 / 引用 / 表格 / 列表 / 段落；
     * 行内只认 `code`、**粗体**、*斜体*、[文字](链接)。说明文档是我们自己写的，够用即可。
     * 刻意【不】处理 [[双链]]：权威正则在 privhub-svc-links/src/linkparse.ts，这里不复制第二份。 */
    function mdEsc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
    }
    function mdInline(s) {
      let out = mdEsc(s)
      out = out.replace(/`([^`]+)`/g, '<code>$1</code>')
      out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      out = out.replace(/\*([^*]+)\*/g, '<em>$1</em>')
      out = out.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, href) => {
        if (/^https?:\/\//.test(href)) return '<a href="' + mdEsc(href) + '" target="_blank" rel="noopener">' + label + '</a>'
        return '<span class="ph-doc-link">' + label + '</span>'
      })
      return out
    }
    function mdToHtml(src) {
      const lines = String(src == null ? '' : src).replace(/\r\n/g, '\n').split('\n')
      const html = []
      let i = 0
      const isSep = (l) => /^\|[\s:|-]+\|$/.test(String(l).trim())
      while (i < lines.length) {
        const t = lines[i].trim()
        if (t === '') { i++; continue }
        if (t.startsWith('```')) {
          const buf = []
          i++
          while (i < lines.length && !lines[i].trim().startsWith('```')) { buf.push(lines[i]); i++ }
          i++
          html.push('<pre><code>' + mdEsc(buf.join('\n')) + '</code></pre>')
          continue
        }
        const h = /^(#{1,6})\s+(.*)$/.exec(t)
        if (h) { html.push('<h' + h[1].length + '>' + mdInline(h[2]) + '</h' + h[1].length + '>'); i++; continue }
        if (t === '---' || t === '***') { html.push('<hr />'); i++; continue }
        if (t.startsWith('>')) {
          const buf = []
          while (i < lines.length && lines[i].trim().startsWith('>')) { buf.push(lines[i].trim().replace(/^>\s?/, '')); i++ }
          html.push('<blockquote>' + mdInline(buf.join(' ')) + '</blockquote>')
          continue
        }
        if (/^[-*+]\s+/.test(t) || /^\d+\.\s+/.test(t)) {
          const ordered = /^\d+\.\s+/.test(t)
          const buf = []
          while (i < lines.length && (/^[-*+]\s+/.test(lines[i].trim()) || /^\d+\.\s+/.test(lines[i].trim()))) {
            buf.push(lines[i].trim().replace(/^([-*+]|\d+\.)\s+/, ''))
            i++
          }
          const tag = ordered ? 'ol' : 'ul'
          html.push('<' + tag + '>' + buf.map((b) => '<li>' + mdInline(b) + '</li>').join('') + '</' + tag + '>')
          continue
        }
        if (t.startsWith('|') && i + 1 < lines.length && isSep(lines[i + 1])) {
          const cells = (l) => l.trim().split('|').slice(1, -1).map((c) => c.trim())
          const head = cells(lines[i]); i += 2
          const rows = []
          while (i < lines.length && lines[i].trim().startsWith('|')) { rows.push(cells(lines[i])); i++ }
          html.push('<table><thead><tr>' + head.map((c) => '<th>' + mdInline(c) + '</th>').join('') + '</tr></thead><tbody>' +
            rows.map((r) => '<tr>' + r.map((c) => '<td>' + mdInline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>')
          continue
        }
        // 段落：合并连续的非空、非结构行
        const buf = [t]
        i++
        while (i < lines.length && lines[i].trim() !== '' &&
               !/^#{1,6}\s|^```|^>|^[-*+]\s|^\d+\.\s|^(---|\*\*\*)$|^\|/.test(lines[i].trim())) {
          buf.push(lines[i].trim()); i++
        }
        html.push('<p>' + mdInline(buf.join(' ')) + '</p>')
      }
      return html.join('\n')
    }

    /* ============ 插件桥 ============ */
    window.PrivHub = { api, AUTH, THEME, VERSION, applyTheme, logout, toast, bus, nav, fileIcon, previewImageUrl, previewPdfUrl, sortedEntries }
    /* 文件内容 URL 工厂也挂上桥：插件侧（explorer-v3/utils.js）会优先保留"先到者"的实现，
     * 于是全站只有一套口径可查 —— 谁想拼 `/f/<id>` 都从 `window.PrivHub.fileContentUrl` 取，
     * 不许在自己文件里再写一份字面量。 */
    window.PrivHub.fileContentUrl = fileContentUrl
    window.PrivHub.previewImageUrl = previewImageUrl
    window.PrivHub.previewPdfUrl = previewPdfUrl
    /* 图标栏角标（插件更新，骨架渲染） */
    window.PrivHub.badges = reactive({ trash: 0 })
    /* 图标栏条目与分发（barItems 来自各插件 manifest；view 决定点击行为，契约扩展） */
    window.PrivHub.manifests = []
    window.PrivHub.barItems = reactive([])
    /* 功能权限开关（服务端 /privhub/api/cap/me）：功能 → 当前用户级别。
     * 管理员恒通过（与服务端 levelFor 一致）；普通用户按表判定。
     * 未登录 / 未加载 / 网络失败一律按「不可用」处理（失败收敛到最保守）。 */
    window.PrivHub.cap = reactive({ levels: {}, loaded: false })

    /* ── 三层角色（2026-11-15）──
       system_admin 系统管理员 > admin 管理员 > user 用户。
       前端所有「是不是管理层 / 能不能管」的判定都走这三个工具，
       **不要再写 `role === 'admin'`** —— 那样会把「管理员」当成最高角色，
       于是管理员也能看见系统设置、系统更新这些该由系统管理员独占的入口。 */
    const ROLE_RANK = { user: 0, admin: 1, system_admin: 2 }
    const roleRank = (r) => (typeof r === 'string' && ROLE_RANK[r] !== undefined ? ROLE_RANK[r] : -1)
    /** 当前用户是否达到某角色（默认 admin = 管理层）。 */
    window.PrivHub.roleAtLeast = (need) => {
      const u = AUTH.user
      if (!u) return false
      return roleRank(u.role) >= (ROLE_RANK[need] === undefined ? ROLE_RANK.admin : ROLE_RANK[need])
    }
    /** 是否管理层（管理员或系统管理员）：能进管理控制台。 */
    window.PrivHub.isManager = () => window.PrivHub.roleAtLeast('admin')
    /** 是否系统管理员：系统本体（设置/更新/存储/审计/集成）才归它。 */
    window.PrivHub.isSystemAdmin = () => window.PrivHub.roleAtLeast('system_admin')
    /** 角色中文名（界面显示用）。 */
    window.PrivHub.roleLabel = (r) => {
      const role = r || (AUTH.user && AUTH.user.role)
      return role === 'system_admin' ? '系统管理员' : role === 'admin' ? '管理员' : '用户'
    }

    const CAP_RANK = { none: 0, read: 1, write: 2 }
    window.PrivHub.capCan = (feature, need) => {
      /* 服务端 levelFor 的判定顺序是「先角色、后开关表」，前端必须同口径：
       * 管理层按角色判定（不看本地表），普通用户才看本地级别表。
       * 这里不能简单 `return true` —— 管理员对「系统本体」类功能仍应被拒。 */
      const u = AUTH.user
      if (u && roleRank(u.role) > ROLE_RANK.user) {
        const lv = window.PrivHub.cap.levels || {}
        /* 服务端会按 minRole 再筛一遍；本地表里有该功能就直接用服务端算好的值，
         * 没有（未加载）时按「管理层放行」的保守可读口径。 */
        if (lv[feature] !== undefined) {
          const nr = need === 'write' ? 2 : (need === 'none' ? 0 : 1)
          return (CAP_RANK[lv[feature]] || 0) >= nr
        }
        return need !== 'write'
      }
      const lv = (window.PrivHub.cap.levels || {})[feature] || 'none'
      const nr = need === 'write' ? 2 : (need === 'none' ? 0 : 1)
      return (CAP_RANK[lv] || 0) >= nr
    }
    window.PrivHub.loadCap = async () => {
      if (!AUTH.user) { window.PrivHub.cap.levels = {}; window.PrivHub.cap.loaded = false; return }
      try {
        const r = await api('/privhub/api/cap/me')
        window.PrivHub.cap.levels = (r && r.ok && r.levels) ? r.levels : {}
        window.PrivHub.cap.loaded = !!(r && r.ok)
      } catch { window.PrivHub.cap.levels = {}; window.PrivHub.cap.loaded = false }
    }
    /* 拉开关表 + 按开关重算图标栏（登录后/恢复登录后调用）。 */
    window.PrivHub.refreshCaps = async () => { await window.PrivHub.loadCap(); window.PrivHub.loadBarItems() }
    window.PrivHub.loadBarItems = () => {
      const items = []
      const admin = AUTH.user && AUTH.user.role === 'admin'
      for (const m of window.PrivHub.manifests || []) {
        for (const bi of (m.barItems || [])) {
          // 声明了 capFeature 的条目按功能开关判定（用户可被逐个放开）；
          // 未声明的沿用 adminOnly 旧口径（仅管理员可见）。
          if (bi.capFeature) { if (!window.PrivHub.capCan(bi.capFeature)) continue }
          else if (bi.adminOnly && !admin) continue
          items.push(bi)
        }
      }
      window.PrivHub.barItems.splice(0, window.PrivHub.barItems.length, ...items)
    }
    window.PrivHub.openBarItem = (bi) => {
      const view = bi.view || bi.slot
      if (view === 'trash') { nav.openTrash() }
      else if (view === 'search') { nav.openSearch() }
      else if (view === 'favorites') { nav.openFavorites() }
      else if (view === 'files') { if (nav.project) nav.openProject(nav.project, { view: 'files' }); else nav.backToWelcome() }
      // ⑤ 功能面板 = 视图（llm_wiki 范式）：图标点击切换 activeView，再点回文件视图
      //    例外：管理控制台不再 toggle —— 管理页之间来回切换时不该被弹回文件页。
      else if (view === 'admin') {
        if (nav.activeView !== 'admin') nav.setActiveView('admin', { noToggle: true })
      }
      //    工作台（home）也走这条：再点一次回到文件视图，等于「从工作台回项目列表」的免费回退。
      else if (view === 'settings' || view === 'acl' || view === 'audit' ||
               view === 'tags' || view === 'template' || view === 'kg' || view === 'wiki' ||
               view === 'mindmap' ||                                          // [mindmap] 项目思维导图视图
               view === 'mindmap-global' ||                                   // [mindmap] 全局思维导图视图（仅管理员）
               view === 'rag' || view === 'agent' || view === 'taskboard' ||   // [kanban] 任务看板视图
               view === 'calendar' ||                                         // [calendar] 任务日历视图
               view === 'dashboard' ||                                        // [dashboard] 项目看板视图
               view === 'refcheck' ||                                         // [refcheck] 引用检查视图
               view === 'me' ||                                               // [me] 个人层「我的」视图
               view === 'home') {                                             // [home] 工作台视图
        nav.setActiveView(view)
      }
    }

    /* ============ 根组件（骨架容器） ============ */
    const App = {
      data() {
        return {
          slotComps: reactive({}),   // 插件 slot 组件：{ slot: [component, ...] }（支持同 slot 多组件）
          auth: AUTH,
          theme: THEME,
          nav,
          badges: window.PrivHub.badges,
          inputValue: '',   // P2-3：内联输入模态值
          // 本次拿到的 manifest 是否只是「登录所需的最小集合」（未登录时服务端分级返回）
          manifestsPartial: false,
          // 首屏超时兜底：8 秒内没渲染出登录界面/工作区，就给出可见错误与重试入口
          bootTimedOut: false,
          // 插件加载失败清单与 manifest 错误：让「界面空白」有可见原因，而不是只留在 console
          failedPlugins: [],
          manifestError: '',
          // GC-15：插件子资源 401 的根因是会话 Cookie 失效；重取也救不回来时置真，
          // 让界面给出「会话已失效 + 重新登录」的可见出口，而不是白屏 + 一闪而过的 toast
          sessionLost: false,
        }
      },
      computed: {
        loggedIn() { return this.auth.user !== null },
        isAdmin() { return this.auth.user && this.auth.user.role === 'admin' },
        crumbs() {
          const parts = this.nav.path ? this.nav.path.split('/').filter(Boolean) : []
          const arr = [{ label: this.nav.project, path: '' }]
          let acc = ''
          for (const p of parts) { acc = acc ? acc + '/' + p : p; arr.push({ label: p, path: acc }) }
          return arr
        },
        ver() { return VERSION },
      },
      watch: {
        // P2-3：输入模态打开时预填初始值
        'nav.inputState'(st) {
          if (st) this.inputValue = st.value || ''
        },
      },
      methods: {
        /* P2-3：内联输入模态确认/取消 */
        confirmNavInput() {
          const st = this.nav.inputState
          if (!st) return
          this.nav.inputState = null
          const fn = st.onOk
          if (fn) void fn(this.inputValue.trim())
        },
        cancelNavInput() { this.nav.inputState = null },
        /* 版本阻断层的唯一动作：整页重载（重新拿到新版本 HTML + 新 Cookie） */
        reloadNow() { window.location.reload() },
        /* L0 品牌点击 / rail「项目总览」：回到 L1 驾驶舱（原型首页）。
         * home 插件缺席时退回项目列表，不留点了没反应的死入口。 */
        goHome() {
          if (nav.hasBarView('home')) nav.setActiveView('home', { noToggle: true })
          else nav.backToWelcome()
        },
        /* 插件加载失败 / 首屏超时后的重试入口（清空错误状态后重新拉取 manifest 并 import） */
        async retryLoadPlugins() {
          this.failedPlugins = []
          this.manifestError = ''
          this.bootTimedOut = false
          this.sessionLost = false
          await this.loadManifests()
          if (this.failedPlugins.length === 0 && !this.manifestError) window.PrivHub.toast('界面已重新加载')
        },
        /* GC-15：会话失效后的显式出口 —— 清会话回到登录面（插件子资源靠会话 Cookie 鉴权，
         * 会话没了插件必然整体 401，白屏是唯一表现。与其反复重试，不如让用户重新登录）。 */
        reLogin() {
          this.sessionLost = false
          this.failedPlugins = []
          if (window.PrivHub.logout) window.PrivHub.logout()
          this.retryLoadPlugins()
        },
        /* manifest 拉取（可重复调用）。
         *
         * 服务端按登录态分级返回：未登录只给「登录界面所需的最小集合」(partial)，
         * 已登录给完整清单。因此：
         *   - 挂载时必须【无条件】调用一次：未登录也要拿到 auth 插件，
         *     否则登录框渲染不出来 → 永久停在「加载中…」→ 无从登录（死锁）；

         * import() 有模块缓存，slot 组件按引用去重，重复调用安全。 */
        async loadManifests() {
          try {
            const m = await api('/privhub/api/shell/manifest')
            if (!m.ok) { console.warn('[shell] manifest 未就绪（未登录或接口异常）'); return }
            window.PrivHub.manifests = m.manifests
            // 记录本次拿到的是否只是「登录所需的最小集合」，登录后据此判断需不需要重拉
            this.manifestsPartial = m.partial === true
            for (const p of m.manifests) {
              if (!p.entry) continue
              try {
                const mod = await import(p.entry)
                const slots = (mod.default && mod.default.slots) || {}
                for (const [slot, comp] of Object.entries(slots)) {
                  const arr = this.slotComps[slot] || (this.slotComps[slot] = [])
                  if (!arr.includes(comp)) arr.push(comp)
                }
                console.log('[shell] 已加载插件 client:', p.id, Object.keys(slots))
              } catch (e) {
                // 单插件失败不应影响其余插件，但【必须让用户看得见】——
                // 否则界面会永久停在「加载中…」，而错误只存在于 console。
                console.error('[shell] 插件加载失败:', p.id, e)
                this.failedPlugins.push({ id: p.id, title: p.title || p.id, error: String((e && e.message) || e) })
              }
            }
            /* 兜底：插件代码需会话 Cookie 才能加载。若 Cookie 缺失导致整体 401，
             * 用 Bearer 换一次 Cookie 后整体重试【一次】（限一次，避免死循环）。
             * 这层是为了不再重演 S16 那类「界面加载不出来、且原因只存在于 console」。 */
            if (this.failedPlugins.length && AUTH.token && !this._authRetried) {
              this._authRetried = true
              const me = await api('/privhub/api/me')
              if (me.ok) {
                this.failedPlugins = []
                console.warn('[shell] 插件加载失败，已重新取会话 Cookie，正在重试一次')
                await this.loadManifests()
                return
              }
              /* GC-15：manifest 拉得到（说明服务端在），但 me 不通 ⇒ 会话本身已失效。
               * 重取 Cookie 救不回来，唯一出路是重新登录。旧行为只弹一个 toast，
               * 用户对着白屏不知所以；这里显式标记，交给模板给出可见出口。 */
              this.sessionLost = true
              console.warn('[shell] 插件加载失败且会话已失效（Cookie 缺失/过期），需重新登录')
            }

              window.PrivHub.toast(this.failedPlugins.length + ' 个插件加载失败，部分功能不可用', 'error')
            }
            window.PrivHub.loadBarItems()
          } catch (e) {
            console.error('[shell] manifest 拉取失败:', e)
            this.manifestError = String((e && e.message) || e)
          }
        },

        startResize(e) {
          e.preventDefault()
          const move = (ev) => {
            const z = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ui-zoom')) || 1
            const w = Math.min(420, Math.max(0, (ev.clientX - 52) / z))
            this.nav.sidebarWidth = w
          }
          const up = () => {
            document.removeEventListener('mousemove', move)
            document.removeEventListener('mouseup', up)
            localStorage.setItem('privhub_sidebar_w', String(this.nav.sidebarWidth))
          }
          document.addEventListener('mousemove', move)
          document.addEventListener('mouseup', up)
        },

              <component v-for="c in slotComps['dashboard-view']" :is="c" :key="c.name" v-else-if="nav.activeView === 'dashboard' && slotComps['dashboard-view'] && slotComps['dashboard-view'].length" @close="nav.setActiveView('files')"></component>
              <!-- [calendar] 任务日历主视图（privhub-task-calendar 提供）：月/周/日三视图，数据同任务看板 -->
              <component v-for="c in slotComps['calendar-view']" :is="c" :key="c.name" v-else-if="nav.activeView === 'calendar' && slotComps['calendar-view'] && slotComps['calendar-view'].length" @close="nav.setActiveView('files')"></component>
              <!-- [refcheck] 引用检查主视图（privhub-files-refcheck 提供）：孤儿附件 + 断链引用，只报告
                   （模板挂载点，升级时勿丢本行；integrity 契约会校验） -->
              <component v-for="c in slotComps['refcheck-view']" :is="c" :key="c.name" v-else-if="nav.activeView === 'refcheck' && slotComps['refcheck-view'] && slotComps['refcheck-view'].length" @close="nav.setActiveView('files')"></component>
              <!-- 管理控制台（admin-console slot，privhub-admin-console 提供）：
                   统一管理外壳 = 顶部栏 + 左侧管理导航 + 内容区。
                   外壳通过 slot-comps 拿到全部插件组件，按当前管理路由渲染对应界面。 -->
              <component v-for="c in slotComps['admin-console']" :is="c" :key="c.name" v-else-if="nav.activeView === 'admin' && slotComps['admin-console'] && slotComps['admin-console'].length" :slot-comps="slotComps"></component>
              <!-- 兼容兜底：管理外壳插件未装载时，仍渲染旧 admin slot（用户管理），
                   保证 openAdmin 这个既有入口在任何情况下都不会变成白屏。 -->
              <component v-for="c in slotComps.admin" :is="c" :key="c.name" v-else-if="nav.activeView === 'admin' && slotComps.admin && slotComps.admin.length" @close="nav.setActiveView('files')"></component>
              <div v-else-if="nav.activeView === 'admin'" class="main-welcome">
                <div class="big">管理控制台加载中…</div>
                <div style="font-size:12px">若长时间停留在此，说明管理外壳插件未装载：请检查 plugins/privhub-admin-console。</div>
              </div>
              <component v-for="c in slotComps.admin" :is="c" :key="c.name" v-else-if="nav.activeView === 'admin' && slotComps.admin && slotComps.admin.length" @close="nav.setActiveView('files')"></component>
              <!-- [home] 工作台视图（privhub-shell-home 提供，client-only 插件）：升级时勿丢本行。
                   少了这一行，图标栏点「工作台」会落到下面的兜底块 —— 白屏但不报错。 -->
              <!-- [me] 个人层「我的」（privhub-shell 提供）：任务 / 日程 / 文件 / 偏好。
                   任务与日程的唯一来源仍是各项目的任务看板，这里只做横切汇总（只读）。 -->
              <component v-for="c in slotComps['me-view']" :is="c" :key="c.name" v-else-if="nav.activeView === 'me' && slotComps['me-view'] && slotComps['me-view'].length"></component>
              <div v-else-if="nav.activeView === 'me'" class="main-welcome">
                <div class="big">个人视图未装载</div>
                <div style="font-size:12px">请检查 plugins/privhub-shell 是否存在（me-view 槽由它提供）。</div>
              </div>
              <component v-for="c in slotComps.home" :is="c" :key="c.name" v-else-if="nav.activeView === 'home' && slotComps.home && slotComps.home.length"></component>
              <div v-else-if="nav.activeView === 'home'" class="main-welcome">
                <div class="big">工作台未装载</div>
                <div style="font-size:12px">请检查 plugins/privhub-shell-home 是否存在并已在图标栏出现。</div>
              </div>
              <!-- 欢迎页（未选项目）：左侧目录树已取消，项目选择收进这里 -->
              <div v-else-if="nav.activeView === 'files' && nav.project === null" class="main-welcome">
                <div class="big">欢迎使用私域枢纽 · 公司文件管理系统</div>
                <div>选择一个项目开始浏览文件</div>
                <div class="welcome-projects">
                  <button v-for="p in nav.projectsList" :key="p" class="welcome-project" @click="nav.openProject(p)">📂 {{ p }}</button>
                </div>
                <div v-if="!nav.projectsList.length" style="font-size:12px;color:var(--muted)">暂无可用项目，请联系管理员开通权限</div>
              </div>
              <!-- 文件面板（F07 files-explorer 提供） -->
              <component v-for="c in slotComps.panel" :is="c" :key="c.name" v-else-if="nav.activeView === 'files' && slotComps.panel && slotComps.panel.length"></component>
              <!-- 兜底：不再无限「加载中」。插件加载失败时给出可见原因与重试入口，
                   否则用户只会看到一个永远转不完的加载提示。 -->
              <div v-else class="main-welcome">
                <template v-if="sessionLost">
                  <!-- GC-15：会话失效导致的插件整体 401 —— 重试无用，直接引导重新登录 -->
                  <div class="big">登录会话已失效</div>
                  <div style="margin-bottom:10px">界面组件未能加载：登录会话（Cookie）缺失或已过期。</div>
                  <button class="btn btn-primary" style="width:auto" @click="reLogin">重新登录</button>
                </template>
                <template v-else-if="failedPlugins.length || manifestError">
                  <div class="big">界面组件加载失败</div>
                  <div style="margin-bottom:10px">{{ manifestError ? ('插件清单拉取失败：' + manifestError) : ('以下插件未能加载：' + failedPlugins.map(p => p.title).join('、')) }}</div>
                  <div style="font-size:12px;color:var(--muted);margin-bottom:14px">常见原因：服务端刚重启、网络中断，或该插件文件缺失。可先重试，仍失败请查看服务端日志。</div>
                  <button class="btn btn-primary" style="width:auto" @click="retryLoadPlugins">重新加载界面</button>
                </template>
                <template v-else><div>文件面板加载中…</div></template>
              </div>
            </div>

            <!-- 原右侧预览槽：详情已收进文件右上角下拉（panel 内 overlay），骨架不再挂载。
                 槽声明与组件保留（manifest 契约 + 可回退）。 -->

            <!-- 上传控制器（F11，不可见：拖拽/文件选择） -->
            <component v-for="c in slotComps.upload" :is="c" :key="c.name" v-if="slotComps.upload && slotComps.upload.length"></component>
            <!-- 上传队列抽屉（F12） -->
            <component v-for="c in slotComps['upload-queue']" :is="c" :key="c.name" v-if="slotComps['upload-queue'] && slotComps['upload-queue'].length"></component>
              </div><!-- /.body -->
            </div><!-- /.ph-content -->
          </div><!-- /.ph-shell -->

          <!-- 水印叠加（F05 auth-watermark 提供） -->
          <component v-for="c in slotComps.watermark" :is="c" :key="c.name" v-if="loggedIn && slotComps.watermark && slotComps.watermark.length"></component>

          <!-- Markdown editor overlay (F16 files-edit-md) -->
          <component v-for="c in slotComps['md-editor']" :is="c" :key="c.name" v-if="loggedIn && slotComps['md-editor'] && slotComps['md-editor'].length"></component>

          <!-- Office 编辑浮层（privhub-files-office-ui：docx/xlsx 编辑，pptx/pdf 只读） -->
          <component v-for="c in slotComps['office-editor']" :is="c" :key="c.name" v-if="loggedIn && slotComps['office-editor'] && slotComps['office-editor'].length"></component>

          <!-- P2-3：骨架级内联输入模态（替代原生 prompt：新建文件夹/重命名/新建项目） -->
          <div v-if="loggedIn && nav.inputState" class="modal-mask" @click.self="cancelNavInput">
            <div class="modal" style="width:380px">
              <h2>{{ nav.inputState.title }}</h2>
              <div class="modal-body">
                <input
                  v-model="inputValue"
                  @keyup.enter="confirmNavInput"
                  placeholder="输入后回车确认"
                  style="width:100%;padding:9px 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px;outline:none"
                />
              </div>
              <div class="modal-foot">
                <button class="btn btn-ghost" @click="cancelNavInput">取 消</button>
                <button class="btn btn-primary" style="width:auto" @click="confirmNavInput">确 定</button>
              </div>
            </div>
          </div>

          <!-- 使用说明弹层（图标栏悬停气泡的「查看完整说明」→ nav.openHelp）。
               文档来自 /privhub/api/help（登录即可读），正文用 mdToHtml 渲染。 -->
          <div v-if="loggedIn && nav.helpDoc" class="modal-mask" @click.self="nav.closeHelp()">
            <div class="modal" style="width:720px">
              <h2>📖 使用说明 · {{ nav.helpDoc.title }}</h2>
              <div class="modal-body">
                <div v-if="nav.helpDoc.loading" style="color:var(--muted);font-size:13px">读取中…</div>
                <div v-else class="ph-doc" v-html="nav.helpDoc.html"></div>
              </div>
              <div class="modal-foot">
                <button class="btn btn-ghost" @click="nav.closeHelp()">关 闭</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 蓝绿更新版本阻断层：挂在 app 外层、与登录态无关。
             切换后旧页面的写请求会被 nginx 409，这里给出唯一正确动作「刷新」。
             读写均不经插件，避免插件弹层截获点击。 -->
        <div v-if="ver.stale" class="privhub-version-mask" role="dialog" aria-modal="true" aria-labelledby="privhub-version-title">
          <div class="privhub-version-card">
            <div id="privhub-version-title" class="privhub-version-title">系统已更新</div>
            <div class="privhub-version-text">
              当前页面属于旧版本<span v-if="ver.current">（{{ ver.current }}）</span>，继续操作可能失败。<br>
              刷新后即可继续使用，通常只需几秒。
            </div>
            <button class="btn btn-primary" style="width:auto" @click="reloadNow">立即刷新</button>
          </div>
        </div>
      `,
    }

    /* ============ 页内功能说明小标 <ph-help>（骨架级全局组件） ============
     * 用法（任意插件模板里）：
     *   <ph-help title="新建列" desc="给看板加一个自定义列" :steps="['① …','② …']"
     *            tips="…" doc="03-协作与看板.md" />
     * 小标贴在被说明的文字 / 按钮右侧；点开弹悬浮窗（挂 body，position:fixed），
     * 同一时刻只开一个；「查看完整说明」跳站内《使用说明》文档（nav.openHelp）。
     * 每个封面的说明文案就地写在模板里，长文仍引导到站内 md —— 与图标栏气泡同一套口径。 */
    let helpUidSeq = 0
    const helpOpenState = reactive({ id: 0 })   // 当前打开的说明小标 id（0 = 都关）
    const HelpBadge = {
      name: 'ph-help',
      props: {
        title: { type: String, default: '功能说明' },
        desc: { type: String, default: '' },
        steps: { type: Array, default: () => [] },
        tips: { type: String, default: '' },
        doc: { type: String, default: '' },
      },
      data() { return { uid: ++helpUidSeq, pos: { top: 0, left: 0 } } },
      computed: {
        open() { return helpOpenState.id === this.uid },
      },
      methods: {
        toggle(ev) {
          if (this.open) { helpOpenState.id = 0; return }
          const el = ev && ev.currentTarget
          if (el && typeof el.getBoundingClientRect === 'function') {
            const r = el.getBoundingClientRect()
            const w = 320
            // 贴着触发点下方；靠近右/下边缘时回收，避免溢出视口
            let left = Math.round(r.left)
            if (left + w > window.innerWidth - 12) left = Math.max(8, window.innerWidth - w - 12)
            let top = Math.round(r.bottom + 6)
            if (top > window.innerHeight - 160) top = Math.max(8, Math.round(r.top - 6 - 200))
            this.pos = { top, left }
          }
          helpOpenState.id = this.uid
        },
        close() { helpOpenState.id = 0 },
        more() { helpOpenState.id = 0; nav.openHelp(this.doc || '00-总览.md') },
        onKeydown(e) { if (e.key === 'Escape') this.close() },
      },
      mounted() { document.addEventListener('keydown', this.onKeydown) },
      beforeUnmount() { document.removeEventListener('keydown', this.onKeydown) },
      template: `
        <span class="ph-hb" role="button" tabindex="0" title="功能说明"
          :aria-expanded="open ? 'true' : 'false'" @click.stop="toggle" @keydown.enter.prevent="toggle">?</span>
        <teleport to="body">
          <div v-if="open" class="ph-hb-mask" @click="close"></div>
          <div v-if="open" class="ph-hb-pop" :style="{ top: pos.top + 'px', left: pos.left + 'px' }">
            <div class="ph-hb-head"><b>{{ title }}</b><span class="ph-hb-x" @click="close">✕</span></div>
            <div v-if="desc" class="ph-hb-desc">{{ desc }}</div>
            <ol v-if="steps && steps.length" class="ph-hb-steps">
              <li v-for="(s, i) in steps" :key="i">{{ s }}</li>
            </ol>
            <div v-if="tips" class="ph-hb-tips">💡 {{ tips }}</div>
            <div class="ph-hb-foot"><a class="ph-help-more" @click="more">📖 查看完整说明</a></div>
          </div>
        </teleport>
      `,
    }

    const app = createApp(App)
    app.component('ph-help', HelpBadge)
    app.mixin({
      methods: {
        fileIcon,
        previewImageUrl,
        previewPdfUrl,
        applyTheme,
      },
    })
    app.mount('#app')
  </script>
</body>
</html>
