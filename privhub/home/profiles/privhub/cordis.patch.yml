# 私域枢纽 profile —— 用户 patch 层，应用在 dsh-base + dsh-web-app + 私有插件之后。
# 目标：在底座基础设施之上，禁用文件盘用不上的 AI 对话 UI，替换成私域枢纽自己的
# 文件盘界面 + 登录/文件接口，并把 webserver 绑定到局域网可访问的 0.0.0.0。
# 实际端口由启动命令 --port 决定：生产 3181（privhub-work/），开发 3180（privhub/）。

# ---- 1. webserver 绑定 0.0.0.0（局域网可访问），端口跟随命令行 --port ----
# host 固定 0.0.0.0（局域网可访问）；port 不写死，由启动命令 --port 决定（兜底回退 3181）。
# 兜底值 3181 = 生产端口；开发环境务必显式传 --port 3180。
- id: webserver
  config:
    host: '0.0.0.0'
    port: !!js ctx.webStartup.port ?? 3181

# ---- 2. 禁用文件盘用不上的「AI 对话」客户端 UI 插件 ----
# 这些是 DSH 的对话/侧边栏/设置等界面，对文件盘是无关杂物，全部禁用。
